# Product facts. Projection of docs/01-proof-bank.md §D and §E.
# The status label travels with the fact into the copy. It is not a design decoration.

business_sectors:
  status: shipped
  source: docs/01-proof-bank.md §D
  # Keep the published English names in every locale.
  names: [Fault Analysis, Home IoT, Risk Management, Security, Healthcare, Vision]

core_advantages:
  status: shipped
  source: docs/01-proof-bank.md §D
  items:
    - { en: Low power consumption, vi: Điện năng cực thấp, ko: 초저전력 }
    - { en: "Private — does not use the cloud", vi: "Riêng tư — không dùng đám mây", ko: "프라이빗 — 클라우드 미사용" }
    - { en: "Fast — instant inferencing", vi: "Nhanh — suy luận tại chỗ", ko: "빠른 온디바이스 추론" }
    - { en: Low cost, vi: Chi phí hiệu quả, ko: 낮은 비용 }

hardware:
  - id: mocha
    name: MOCHA
    generation: 1
    status: shipped
    date: "2021-11"
    note: First-generation PIM edge AI chip.

  - id: mint
    name: MINT
    generation: 2
    status: shipped
    architecture: Analog-PIM
    mass_production_since: "2023-05"
    source: "docs/01-proof-bank.md §E1 — SmartTimes/JBNU, IR Deck p.21"
    specs:
      - { label: Energy efficiency, value: "17.6", unit: TOPS/W, note: "IR Deck rounds this to 17" }
      - { label: Performance, value: "30", unit: GOPS }
      - { label: Die size, value: "5 × 5", unit: mm² }

  - id: papaya
    name: PAPAYA FLEX
    generation: 3
    status: shipped
    source: docs/01-proof-bank.md §E2
    # Every multiple below must name Jetson Nano in the copy. The FPS/W line must name ResNet-50.
    benchmarks:
      - { metric: Power, value: "~50×", against: NVIDIA Jetson Nano, detail: "0.1–0.15 W vs 5–10 W" }
      - { metric: Efficiency, value: "~100×", against: NVIDIA Jetson Nano, detail: "ResNet-50, 333–500 vs 3.6–7.2 FPS/W", required_context: ResNet-50 }
      - { metric: Size, value: "~25×", against: NVIDIA Jetson Nano, detail: "10 × 10 mm vs 70 × 45 mm" }
      - { metric: 5G base station AI task, value: "~10,000×", against: NVIDIA L4, detail: "320–332 W to 0.03 W", required_context: "for the AI task at the base station, not the whole station" }

  - id: espresso
    name: ESPRESSO
    status: roadmap
    available_from: "2026-09"
    source: "IR Deck 2026-01-05 — investor material only"
    status_note: "Not present on any public Pebble Square page (verified 2026-08-20). Every mention needs the amber label and the words: investor material, not on the public catalogue."
    specs:
      - { label: Performance, value: "160", unit: "TOPS @INT8" }
      - { label: Performance, value: "100", unit: "TFLOPS @bFP16" }
      - { label: Power, value: "10", unit: W }
      - { label: Efficiency, value: "16", unit: TOPS/W }
      - { label: Package, value: "20.5 × 23", unit: "mm 1799-pin FCBGA" }
      - { label: Four-chip card, value: "640", unit: TOPS }
      - { label: Interface, value: "PCIe Gen4 ×4" }
      - { label: On-prem LLM, value: "120", unit: "billion parameters" }

software:
  - id: ai-studio
    name: Pebble AI Studio
    status: shipped
    description: Integrated SDK for deploying and optimizing models on PIM chips; includes an AI accelerator.
  - id: on-device-apps
    name: On-Device AI Applications
    status: shipped
    areas:
      - { name: Sound, detail: speech recognition for smart home and wearables }
      - { name: Vision, detail: image processing for healthcare and manufacturing }
      - { name: Security, detail: "threat detection without network dependency" }
      - { name: Risk Management, detail: real-time anomaly detection }
      - { name: Fault Analysis, detail: "early failure detection for robots and machinery" }
  - id: onprem-llm
    name: On-premise LLM inference server
    status: split
    status_note: "The NVIDIA configuration is sellable today (shipped). The ESPRESSO configuration is roadmap. Split the two whenever this is written about."
    source: docs/01-proof-bank.md §E4
    detail: "4U chassis, EPYC 9355, AI SoC = NVIDIA or ESPRESSO."

services:
  status: shipped
  items: [AI chip design, AI algorithm development, Solution development]

context_framing:
  status: shipped
  note: "Framing of the problem, not a Pebble Square claim. Attribute it as industry context."
  items:
    - "Data centres consume roughly 2% of global electricity"
    - "Roughly 300,000 gallons of water per day"

three_layer_rule:
  source: docs/01-proof-bank.md
  layers:
    - "1. PIM as a principle — academic grounding, safe to explain"
    - "2. MINT at 17.6 TOPS/W — a measured figure, in mass production"
    - "3. Application in Vietnam — Pebble Vina's own layer, with UL 1699B · IEC 63027:2023 · TCVN 11855-1:2017"
  forbidden_merge: "Never compress the three layers into 'Pebble Square does arc-fault detection on PIM chips'. That single sentence loses an engineering audience."
