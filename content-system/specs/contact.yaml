blocks:
  - id: contact.intro
    origin: pv
    status: shipped
    height: screen # left column of <Section id="book" screen> — page-contact.tsx
    intent:
      communicate: that writing in starts something, and what happens on our side once it is sent
      reader_question: if I fill this in, does anyone actually come back to me
    claims: [C049]
    qualifiers:
      - 'Lean professional register replaces the 2026-08-24 warm override. Direct, calm and action-led; no thanks, hope, urgency or emotional close.'
      - 'The block shares one viewport with the form and contains no Figure. One headline and one promise sentence only.'
      - 'C049 is wall-clock, weekends included, and starts after successful form receipt. It promises sales contact only.'
    forbidden:
      - any bounded promise other than the 24 hours C035 licenses — no duration for the call, no headcount, no delivery date
      - '`trong 1 ngày làm việc` or any business-hours softening of the 24-hour commitment'
      - scarcity, "limited slots", countdowns, or a deadline the market did not create
      - implying Pebble Vina is a subsidiary rather than a member of the group
      - "`chúng tôi` as the subject of the parent's work — docs/02-message-map.md §5"
      - gratitude, hope-to-work-together language, `nhanh nhất có thể`, `quý doanh nghiệp`, `trao giá trị`, or `đặt lịch`
      - promising diagnosis, a ready solution or a resolved business problem within 24 hours
    slots:
      kicker: >-
        a short category label for a consultation request, not an urgency prompt. Plain label,
        no index number. It renders mono uppercase, so Vietnamese diacritics must survive.
      title: >-
        directly ask the business to fill in the form so Pebble Vina can receive its problem.
        Renders as the page <h1>. One line of thought, soft limit 12 Vietnamese words.
      lead: >-
        exactly one short sentence, highlighted by layout: a Pebble Vina sales team member contacts
        the submitter through the supplied details within 24 hours (C049). Do not add a second idea.

  - id: contact.form
    type: product_ui
    origin: pv
    status: shipped
    height: content
    intent:
      communicate: what pressing the button does, before it is pressed
      task: describe a problem and hand over a way to be reached
    mechanisms:
      # REWRITTEN 2026-08-25 by decisions/submit-posts-to-endpoint. The three mailto lines
      # that stood here are quoted in that decision and are not describing this component.
      - submit POSTs the five fields to /api/contact; the request reaches Pebble Vina without the visitor doing anything else
      - the form has exactly three visible states — filling in, sent (the panel replaces the form), failed (one line beside the button, the button still live)
      - a failure gives the component no cause it can name. 429, 5xx and a dead network are one state to the reader, and the code passes none of them to the copy
      - the panel that replaces the form renders only successTitle and successBody; the failure line still appends SITE.contact.phone and SITE.contact.email after the string
    qualifiers:
      - 'Success copy describes a RECEIVED request. `đã nhận` is true here as of 2026-08-25 and nowhere else on the site.'
      - 'Receipt is not correspondence: no acknowledgement email goes to the visitor. Copy may not imply one is on its way.'
      - 'Required fields are name, company, email and message. Optional is phone only. The component appends a space-asterisk after each required label and a middot plus {optionalLabel} after the optional one — the copy must not repeat the marker, only explain it.'
      - 'Every field label renders mono, ~10px, uppercase, letter-spaced (contact-form.tsx Field). Two or three words maximum, no terminal period, and diacritics must survive uppercasing — VĂN PHÒNG, never VAN PHONG (references/locales/vi.md).'
    forbidden:
      - 'any response-time number other than C049; 24 hours is permitted in successBody because the successful state starts the clock'
      - 'LIFTED 2026-08-25: "đã gửi" / "đã nhận được" were forbidden as untrue under the mailto. The POST makes them true — decisions/submit-posts-to-endpoint.'
      - "anything on the visitor's machine: ứng dụng mail, cửa sổ vừa mở, thư đã soạn sẵn, and the old privacy clause `chưa có gì rời máy bạn`. Nothing opens locally any more, and the data does leave the machine — that is the point of the button."
      - 'the plumbing, in either direction: lưu vào hệ thống / cơ sở dữ liệu / máy chủ, and "gửi email tới chúng tôi" as a customer-facing action. The visitor filled in a form and it arrived.'
      - 'any acknowledgement email to the visitor — none is sent'
      - 'a cause for the failure. The component knows none, so inventing one (mạng, máy chủ, Resend) is a guess printed as a fact. A status code is additionally PRODUCT_TECHNICAL_LEAKAGE.'
      - '`vui lòng`, `bạn hãy`, `quý khách`, an apology, or a pronoun in a field label'
      - 'a bare vague verb as the button — lint_product flags gửi · xác nhận · tiếp tục · đồng ý · hoàn tất for vi. The button names the action it performs.'
      - marketing register inside the form — hành trình, nâng tầm, bứt phá, khai phá
    slots:
      title: >-
        RECOMPILE 2026-08-26. Name what the form actually does: submit a consultation
        request, not book or confirm a calendar appointment. Renders as a mono uppercase
        label in the right column. A label, not a sentence: 2–4 words, no terminal period.
      nameLabel: the person's own name
      companyLabel: the organisation they are writing on behalf of — required, not a courtesy field
      emailLabel: email address
      phoneLabel: phone number — the only optional field
      messageLabel: the problem description
      messagePlaceholder: >-
        a concrete example of the kind of detail that makes a thirty-minute call
        useful rather than exploratory. Must read as an example, not an instruction.
        Renders inside the textarea at 14px, so it must survive being cut off at the
        field width on mobile — front-load the discriminating word.
      optionalLabel: >-
        the marker appended after a label that may be left empty. Rendered as
        " · <value>" in mono uppercase. Two words maximum.
      requiredNote: >-
        DELETED 2026-08-24 by decisions/drop-preform-contact-block — GM judged the
        standalone caption beside the submit button to be clutter. The key is gone from
        vi.ts; this slot is kept only so the next compile does not re-create it. The
        component's " *" suffix on required labels is unaffected and stays.
      successTitle: >-
        RECOMPILE 2026-08-26 (decisions/success_panel_repair_2026_08_26). Confirm receipt
        once, with Pebble Vina as the receiver. Do not pad the state with `của bạn` when
        the panel already follows that visitor's own submit action. No terminal period.
      successBody: >-
        RECOMPILE 2026-08-26 (decisions/lean_contact_recompile_2026_08_26). Carry the one
        fact the title does not: a Pebble Vina sales team member contacts the submitter through
        the supplied details within 24 hours after this successful receipt (C049). One short
        sentence. No `không cần làm gì
        thêm`, no acknowledgement-email implication, and no direct-contact fallback; the
        success-only phone/email list is removed and the footer already carries those facts.
      errorBody: >-
        NEW 2026-08-25. The only failure copy the form has. Shown when the POST does not
        return ok — inline, in the same flex row as the submit button, `role="alert"`, so
        it is announced whole.
        THE COMPONENT APPENDS THE FALLBACK: it renders `{errorBody} <a>phone</a> ·
        <a>email</a>`. The string must therefore END by introducing those two — a colon,
        or a phrase that governs what follows — never with a full stop, which would leave
        a phone number stranded as a sentence of its own. Do not retype either value into
        vi.ts; they live in web/content/site.ts.
        CARRIES, in order (references/product/errors.md): the state, then two actions —
        press the button again, or reach a person directly. No cause: the component is
        given none, and 429, 5xx and a dead network are one state to the reader. No
        apology — `rất tiếc` and `có lỗi xảy ra` are the Vietnamese generic-failure
        patterns lint_product flags, and vi.md's error rule is state, then action.
        LENGTH: one line beside the button. The block has no slack, and the appended
        phone and email add roughly 40 characters the copy does not control.
    slots_outside_the_form_object:
      # Both live at contact.* rather than contact.form.*, but belong to this block.
      ctaPrimary: >-
        RECOMPILED 2026-08-25. The submit button names what pressing it does, and what it
        does is now send the request to Pebble Vina
        (decisions/submit-posts-to-endpoint) — a delivery the button DOES perform, which
        is what changed. Name the object in the reader's terms, not `form`: they came to
        ask for a consultation. VI ceiling 28 characters
        (brand/voice.yaml ui_limits.button.vi) and lint_product rejects a bare
        gửi · xác nhận · tiếp tục · đồng ý · hoàn tất — so a bare `Gửi` is rejected by the
        linter and by the rule behind it; the verb needs its object. Every CTA on the site
        routes to this page and this button is the only thing on the site that submits
        anything.
      media.alt: >-
        DELETED 2026-08-26 by decisions/lean_contact_recompile_2026_08_26. The office Figure
        no longer renders on CONTACT and contact.media is removed from the content shape.

