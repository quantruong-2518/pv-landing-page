# Semantic spec — CONTACT (/vi/contact). Language-free by design.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ STATUS: CONFIRMED 2026-08-24. Gate F returned a go on all eight          │
# │ questions; the answers are in `decisions:` with what each does NOT       │
# │ license. 15 keys written, 3 held — see `scope:`. What remains open is    │
# │ in `open_decisions:` and none of it blocks the 15.                       │
# └──────────────────────────────────────────────────────────────────────────┘
#
# This is the ONLY input a locale writer may read. It exists so that `en` and `ko`
# can later be written natively from the same meaning instead of being translated
# out of `vi`, which the content-i18n skill forbids in both directions.
#
# Compiled 2026-08-23. Revised 2026-08-23 after reading the components: the first
# draft placed two slots in a block that does not render them (see `revision_log`).
# Gate F closed 2026-08-24 via the two-pass protocol — the gates were returned to the
# requester, answered, and only then compiled. All three revision_log corrections were
# verified against the components by the requester before the answers were given.
#
# Sources: docs/00-brief.md, docs/01-proof-bank.md §A §F §H, docs/02-message-map.md,
# docs/03-structure.md §1 §3 §4, docs/05-backlog.md, web/content/site.ts,
# web/content/types.ts, web/components/page-contact.tsx, web/components/contact-form.tsx,
# web/components/ui.tsx, context/03-contact/contact.md.
# Claim ids resolve against content-system/claims/approved.yaml.
#
# Reading rule, inherited from specs/home.yaml, unchanged:
#   `docs/` and `context/` are written ABOUT the page. They are not the page. Read
#   them for FACTS, never for editorial framing. `context/` carries English sentence
#   shape (docs/05-backlog.md #16b) — MATERIAL, not copy.
#
# And the rule that keeps blocks from bloating:
#   A `body` earns its place only by adding a FACT its `title` does not carry. No
#   such fact → leave it empty. Components skip empty strings by design.
#
# Mixed routing, deliberate:
#   meta.contact.* / contact.intro.*                 -> marketing
#   contact.ctaPrimary / contact.media.alt / contact.form.*  -> product_ui
# The form is an interface, not a pitch. It is graded on task completion, never on
# persuasion (content-i18n §1). Labels take no pronoun and no `vui lòng`.

id: contact
type: marketing            # the page; the form block overrides to product_ui

# ── What the first draft got wrong, and why it mattered ─────────────────────
# Kept for the next session so the same slot is not re-misplaced.
revision_log:
  - slot: contact.ctaPrimary
    was: listed under `contact.intro` as "the booking action"
    is: >-
      the SUBMIT BUTTON of the form — web/components/contact-form.tsx:123. The intro
      block renders no button at all: page-contact.tsx gives it SectionHead plus a
      <dl> of phone and email, nothing else. Consequence: this string must say what
      PRESSING it does, and it is graded by lint_product (vague-label list, 28-char
      VI ceiling), not as a marketing CTA.
  - slot: contact.media.alt
    was: listed under `contact.intro` as "the office or team image slot"
    is: >-
      the alt of a <Figure> that renders ONLY inside the post-submit success panel —
      contact-form.tsx:47. And `contact.media` has no `src`, so <Figure> falls through
      to <MediaPending>, which prints the alt as VISIBLE ON-SCREEN TEXT (ui.tsx:284),
      not as assistive text. A human reads this string.
  - slot: contact.form.requiredNote
    was: 'premised on "optional fields must be marked, so the required set reads as short"'
    is: >-
      four of five fields are `required` in the component — name, company, email,
      message. Only phone is optional. The required set is not short, and the copy
      may not pretend otherwise. The component appends " *" to every required label
      and " · {optionalLabel}" to the optional one; the note has to explain that mark.
  - slot: contract.proof
    was: 'C019 listed under `verified`'
    is: >-
      C019 is `usable: conditional`, qualified "member of the group — never
      wholly-owned subsidiary, ownership is unverified". It belongs under
      `contextual`, where its qualification travels with it.

contract:
  page:
    type: contact
    goal: convert an interested reader into a scheduled conversation
    funnel_stage: decision
  audience:
    primary: Vietnamese industrial and enterprise buyers; Korean FDI firms in Vietnam
    buyer: plant, IT or procurement decision-maker
    awareness_level: solution-aware — they have read the catalogue and want a person
    primary_problem: they do not know whether their problem is even the right shape for this
    note: >-
      The site ships Vietnamese only since 2026-08-23 (CLAUDE.md §4). A Korean FDI
      reader therefore reads this page in Vietnamese, and stays primary
      (decisions/audience-after-en-removal).
  product:
    name: a thirty-minute consultation
    mechanism: >-
      There is no backend in this repository (docs/00-brief.md). The form composes a
      mail draft in the visitor's own client via `mailto:` — the same mechanism as
      CTA_HREF in web/content/site.ts. Nothing is transmitted to a server, so no copy
      may promise receipt, a ticket, a queue or a reply time.
  proof:
    verified: []
    contextual: [C019]
    unavailable:
      - business hours — docs/05-backlog.md
      - response time and support model in Vietnam — docs/05-backlog.md B10
      - office photography, Landmark 72 — docs/05-backlog.md #5, G9 still open
      - Pebble Vina incorporation date — docs/05-backlog.md
      - any customer, deployment, unit count or revenue figure — docs/01-proof-bank.md §H4
  differentiators:
    - the legal entity, tax code and registered office sit on the page, checkable in 30 seconds
    - the offer includes being told the answer is no
  objections:
    - a new Vietnamese entity with no record of its own
    - will this turn into a sales call
  cta:
    primary: submit the form, which hands the filled-in fields to the visitor's own mail client
  tone:
    desired: [precise, understated, engineer-readable, honest about status]
    avoid: [luxury language, emotional hype, urgency pressure, false scarcity, thought-leadership voice]
  claims_policy:
    allow_inference: false
    require_proof_for_numbers: true
    require_proof_for_superlatives: true
  locale:
    requested: [vi]
    deferred: [en, ko]
    note: >-
      A deferred locale is compiled from THIS file, never from the written `vi`.
      Adding one means a complete web/content/<locale>.ts plus its routes — not half
      a language (CLAUDE.md §3).

# ── Gate F closed 2026-08-24. All eight questions answered by the requester ──
# through the calling session. The two-pass protocol (return the gates, receive
# the answers, then compile) is the documented path, not a fallback.
decisions:

  thirty-minutes-as-a-claim:
    question: "is the 30-minute duration an offer or a claim needing a proof-bank line — this spec, first pass"
    answered: neither; drop the number. The page offers `tư vấn` with no duration.
    but: nothing may take its place.
    consequence: "No slot may state a duration, a headcount or any other bounded promise to compensate for the missing number. An unbounded invitation is the whole point."
    superseded_in_part: >-
      The words `a response time` stood in the consequence above until 2026-08-24. The GM struck
      them and committed a real number instead — see decisions/response-time-commitment. The rest
      of this decision stands: the duration of the call is still absent, and no OTHER bounded
      promise may appear. One promise was authorised, not the category.
    still_open: []

  response-time-commitment:
    question: >-
      the GM asked the left column to say a PV person gets back quickly. The proof bank had no
      response-time line, so this was a wanted claim with no ledger entry — intake Gate C, blocking.
    answered: commit a real number. GM chose 24 hours, 2026-08-24.
    but: >-
      it is a promise, not a measurement. Nothing has yet measured whether the team keeps it, and
      the option of writing it unquantified was offered and declined.
    consequence: >-
      C035 exists and licenses the token `24` in this page's copy. The commitment is written as
      wall-clock hours, weekends included — `trong 24 giờ`, never `trong 1 ngày làm việc`, which is
      a different and weaker promise the GM did not make. The block's old `forbidden` line against
      promising a response time is lifted for THIS number only; any other bounded promise still
      falls under decisions/thirty-minutes-as-a-claim. If the team stops keeping the mark, the fix
      order is docs/01-proof-bank.md §F first, then this spec, then the page — never the page alone.
    still_open: [whether 24h wall-clock survives contact with a real weekend inbox]

  voice-override-contact-intro:
    question: >-
      the requested register — `Bắt đầu ngay`, thanks for the reader's interest, hope to work
      together — runs against three lines the GM himself set in brand/voice.yaml the same day:
      `never: urgency the market did not create`, `avoid: emotional hype`, and the persona move
      `names the risk before the buyer finds it`. It also retires `Câu trả lời có thể là không`,
      which contract/differentiators lists as one of only two differentiators this page has.
    answered: write the new register. GM, 2026-08-24, after the conflict was put to him in full.
    but: >-
      it is an override for THIS block, not an edit to the persona. brand/voice.yaml is unchanged
      and still governs every other block on every other page.
    consequence: >-
      contact.intro.kicker, title and lead are written warm and inviting, and a future compile must
      NOT "restore the persona" here. What the override does not license: the four bans in
      CLAUDE.md §2 are untouched, no superlative arrives without a counterparty, and the warmth may
      not turn into a capability claim — thanking a reader is not the same as promising an outcome.
      The honest-no stance is retired from the intro only; it is not contradicted anywhere.
    still_open: >-
      contract/differentiators still lists `the offer includes being told the answer is no`. With
      the intro rewritten, that differentiator is no longer stated anywhere on the page. Raised, not
      resolved — it is a positioning question for the GM, not a compiler decision.

  nav-drops-contact-link:
    question: "the header carried both a `Liên hệ` nav link and a `Đặt lịch tư vấn` button pointing at the same route"
    answered: drop the nav link, keep the button. GM, 2026-08-24.
    but: the route is unchanged and the page keeps its own URL.
    consequence: >-
      site-header.tsx builds `links` from home and products only; the CTA button is the single path
      to /vi/contact from the header, at every width. `c.nav.contact` is STILL a live key — the
      button uses it as its short label under 640px — so it must not be deleted from vi.ts.
      The footer navigation is untouched and still lists all three pages.
    still_open: []

  one-white-surface:
    question: "does CONTACT keep a dark hero above the form"
    answered: no. One light block holds the invitation and the form together. GM, 2026-08-24.
    but: this is a layout decision, and it moved the block-height budget.
    consequence: >-
      contact.intro is no longer its own Section. It is the left column of a single
      `<Section id="book" screen>` whose right column is the form, and it now carries the office
      <Figure> beneath the lead. Measured at 836px against an 836px budget at 1440x900 BEFORE this
      rewrite — the block has no headroom at all. Prose added to the lead overflows the viewport,
      which is why the lead below carries a hard sentence ceiling rather than a soft word limit.
    still_open: [the 390x844 measurement, which the engineer reported at 1323px against a 788px budget]

  kicker-numbering:
    question: "is contact.intro.kicker numbered `03 · …` like home's section indices"
    answered: no page numbering. The kicker is a plain label.
    but: this is not licence to leave it a bare nav echo; it still has to orient a reader who arrived from the catalogue.
    consequence: "contact.intro.kicker is a short label naming where the reader is in the sequence, not an index number."
    still_open: []
    also_binds: "products.intro.kicker takes the same treatment — record as inherited_from when that spec is next touched."

  success-panel-image:
    question: "what does the empty success-panel image slot hold — docs/05-backlog.md #5"
    answered: the Landmark 72 office.
    but: no file exists, so the alt is on-screen text today and real alt text later.
    consequence: "contact.media.alt is written as an art-direction brief a customer can read without embarrassment — not accessibility phrasing, not a note to a photographer. It must work unchanged as the alt attribute once the photograph lands."
    moved_2026_08_24: >-
      The image is no longer in the success panel. Two pending frames were on screen at once after
      submit (the engineer measured 1 before submit, 2 after); the GM cut the panel one and kept the
      left-column one. The picture is now evidence a reader sees BEFORE deciding to write, which is
      where it earns its place — a thank-you note does not need a photograph. `contact.media.alt` is
      unchanged and still the only writable slot for it.
    still_open: ["the photograph itself — GM, docs/05-backlog.md #5, G9 still open"]

  meta-tax-code:
    question: "does meta.contact.description carry the tax code"
    answered: yes, 0111545175.
    but: the tax code is the only number the ledger licenses here (C019).
    consequence: "No other figure may enter the description. The street address is excluded — Landmark 72 and floor 19 are numbers with no ledger entry, and check_claims reads the marketing artifact."
    still_open: []

  audience-after-en-removal:
    question: "do Korean FDI readers still count as primary now that the English build is gone"
    answered: yes, they remain primary and they read Vietnamese.
    but: this rules out idiom and wordplay, NOT natural sentence rhythm.
    consequence: "contact.intro.title, contact.intro.lead and contact.form.messagePlaceholder avoid colloquialism and figurative language. Flattened textbook Vietnamese is a failure of this decision, not a satisfaction of it."
    still_open: []

  intro-lead-budget:
    question: "one sentence or two in contact.intro.lead, given the screen block already carries the phone/email dl"
    answered: not decided by argument — decided by measurement, which happens after this run.
    but: the measurement has not been taken yet.
    consequence: "Write BOTH. Apply the two-sentence version, because it carries the honesty move. Report the one-sentence fallback verbatim so the calling session can swap it at 1440x900 without another compile."
    still_open: [the measurement at 1440x900 — does the phone/email dl stay above the fold]

  cta-label-honesty:
    question: "does the submit button keep promise-wording or name the mail-draft mechanism"
    answered: superseded. The code moved under this spec.
    but: the replacement behaviour does not exist yet.
    consequence: "CTA_HREF is deleted from content/site.ts and page-home.tsx now routes to path(contact), so `đặt lịch` means `go to the contact page` and the form is the only thing that mails. The requester wants submit to SAVE and show a thank-you panel. Until that endpoint exists, contact.ctaPrimary is HELD as a placeholder."
    still_open: [what submit says once it saves rather than mails]

  real-form-endpoint:
    question: "is there a submission endpoint"
    answered: a Postgres-backed endpoint on Vercel is being built as a separate task.
    but: it does not exist yet; the component still fires a mailto.
    consequence: "Nothing may describe a saved, received, queued or acknowledged submission. contact.form.successTitle and contact.form.successBody are HELD as placeholders — writing them now guarantees copy that is false on the day it ships."
    still_open: [all three held keys, which land with the endpoint]

  submit-stays-mailto:
    question: "the endpoint landed in the repo (app/api/contact/route.ts, lib/contact-submission.ts, db/001_contact_submission.sql) but contact-form.tsx still fires a mailto. Which behaviour does the copy describe — asked 2026-08-24"
    answered: mailto stays. The copy describes the mail draft, not a saved submission.
    but: the endpoint exists and is unwired, so the two can drift apart in one commit.
    consequence: >-
      The three held keys are RELEASED and written against the mailto mechanism this spec
      already documents under blocks/contact.form/mechanisms. `đã nhận`, `đã gửi`, `đã lưu`
      and any response time stay forbidden. The day contact-form.tsx POSTs instead of
      mailing, all three keys are false and must be recompiled from this spec — that is a
      content dependency of the wiring task, not a follow-up someone may skip.
    still_open: ["wiring the form to POST /api/contact — engineer task, and it invalidates these three keys when it lands"]

  drop-preform-contact-block:
    question: >-
      2026-08-24, GM complaint about the footer ("content không tốt, layout dở tệ mobile,
      sai tên trang web pebblevina.com") led to a mobile-ui-reviewer audit that measured
      /vi/contact's footer repeating phone/email/office/tax-id 86.9px below the submit
      button — the same four facts the page's own <dl> (phone/email hero) and
      office+legal column already show above the form. GM asked directly: cut the repeat
      at the footer, or cut the page's own pre-form block and let the footer be the only
      place those facts live?
    answered: >-
      cut the page's own block, not the footer. /vi/contact now renders SectionHead
      (contact.intro) and the form ONLY — no <dl>, no office/legal column.
    but: >-
      does not remove labels.call/email/office/entity/taxCode/parent — the footer still
      uses all of them. Does not change SITE.contact/SITE.office/SITE.legalName/SITE.taxId
      — those facts are unchanged, just no longer duplicated on this page.
    consequence: >-
      contact.form.successBody's fallback sentence can no longer say "ở đầu trang" —
      that <dl> is gone. Per docs/05-backlog.md #28 (already open, same root cause), the
      success panel itself must render SITE.contact.phone/email directly
      (web-ui-engineer task, contact-form.tsx), and successBody's fallback clause points
      at THIS panel, not a location elsewhere on the page. contact.form.requiredNote is
      also cut in the same pass — GM judged it clutter beside the submit button; the " *"
      suffix the component already prints on required labels stays (that convention is
      not what was cut).
    still_open: []

# Written this run: 15 keys. Held deliberately: 3.
# Repaired 2026-08-24: contact.form.successBody (drop-preform-contact-block); contact.form.requiredNote deleted.
scope:
  written:
    - meta.contact.title
    - meta.contact.description
    - contact.intro.kicker
    - contact.intro.title
    - contact.intro.lead
    - contact.media.alt
    - contact.form.title
    - contact.form.nameLabel
    - contact.form.companyLabel
    - contact.form.emailLabel
    - contact.form.phoneLabel
    - contact.form.messageLabel
    - contact.form.messagePlaceholder
    - contact.form.optionalLabel
  written_2026_08_24:
    - "contact.ctaPrimary — released by decisions/submit-stays-mailto"
    - "contact.form.successTitle — released by decisions/submit-stays-mailto"
    - "contact.form.successBody — released by decisions/submit-stays-mailto"
  held: []
  held_note: "Nothing held. The three keys that were placeholders describe the mailto mechanism, which the requester confirmed on 2026-08-24 is the shipping behaviour."
  deleted_2026_08_24:
    - "contact.form.requiredNote — cut by decisions/drop-preform-contact-block. Removed from
       web/content/vi.ts and from content-system/output/contact-form.vi.json in the same pass.
       The matching field in web/content/types.ts and the <p> in contact-form.tsx are the
       engineer's half of the same change. Do NOT re-add it from revision_log: the reasoning
       there (four of five fields required, so the ` *` mark needed explaining) is correct and
       was overridden anyway. The ` *` suffix itself stays."


blocks:

  - id: contact.intro
    origin: pv
    status: shipped
    height: screen          # left column of <Section id="book" screen> — page-contact.tsx
    intent:
      communicate: that writing in starts something, and what happens on our side once it is sent
      reader_question: if I fill this in, does anyone actually come back to me
    claims: [C019, C035]
    qualifiers:
      - "Rewritten 2026-08-24 under decisions/voice-override-contact-intro. The register here is warm and inviting and does NOT follow brand/voice.yaml's persona. That is deliberate and scoped to these three keys — do not normalise it back."
      - "The block shares one viewport with the form (decisions/one-white-surface) and carries the office <Figure> under the lead. Measured 836px against an 836px budget at 1440x900 BEFORE this rewrite: there is no headroom. This is why the lead is capped at two sentences and the title at one line of thought, not at a word count someone can argue with."
      - "C019 is conditional. Thành viên nhóm survives into every locale; công ty con, 100% and any ownership percentage do not (F005)."
      - "C035 is the 24-hour reply. It is wall-clock, weekends included. `trong 1 ngày làm việc` is a DIFFERENT, weaker promise and is not what the GM committed to."
    forbidden:
      - any bounded promise other than the 24 hours C035 licenses — no duration for the call, no headcount, no delivery date
      - "`trong 1 ngày làm việc` or any business-hours softening of the 24-hour commitment"
      - scarcity, "limited slots", countdowns, or a deadline the market did not create
      - implying Pebble Vina is a subsidiary rather than a member of the group
      - "`chúng tôi` as the subject of the parent's work — docs/02-message-map.md §5"
      - turning warmth into capability — thanking a reader for writing is not a promise that the problem can be solved
    slots:
      kicker: >-
        the GM's own words are `Bắt đầu ngay`. Written as a plain label, no index number
        (decisions/kicker-numbering). It renders mono uppercase, so diacritics must survive
        uppercasing (references/locales/vi.md).
      title: >-
        the invitation to start, in the reader's interest rather than ours. Renders as the page
        <h1>. Soft limit 12 words (brand/voice.yaml marketing.hero.headline_soft_limit.vi).
        Replaces `Kể bài toán của bạn. Câu trả lời có thể là không.` — see
        decisions/voice-override-contact-intro for what that retirement costs and who decided it.
      lead: >-
        two sentences, hard ceiling — the block has zero measured headroom. Sentence one: what to
        send and that a Pebble Vina person answers within 24 hours (C035, wall-clock). Sentence two:
        the thanks and the wish to work alongside the reader's company. The old lead's list of three
        things to bring moves out of here. It is not lost: contact.form.messagePlaceholder already
        carries all three as a worked example — which machines, which signal, whether the data may
        leave — sitting in the field where the reader is about to type them. Restating them in the
        lead costs two lines of a block that has none, and says them further from the point of use.

  - id: contact.form
    type: product_ui
    origin: pv
    status: shipped
    height: content
    intent:
      communicate: what pressing the button does, before it is pressed
      task: describe a problem and hand over a way to be reached
    mechanisms:
      - submit opens the visitor's own mail client with subject and body pre-filled
      - nothing reaches a server; there is no record on our side until the visitor sends the mail
      - the mail client may not open at all — a webmail user with no handler registered sees nothing
    qualifiers:
      - "Success copy describes a COMPOSED DRAFT, never a received message. The visitor still has to press send in their own client."
      - "Required fields are name, company, email and message. Optional is phone only. The component appends a space-asterisk after each required label and a middot plus {optionalLabel} after the optional one — the copy must not repeat the marker, only explain it."
      - "Every field label renders mono, ~10px, uppercase, letter-spaced (contact-form.tsx Field). Two or three words maximum, no terminal period, and diacritics must survive uppercasing — VĂN PHÒNG, never VAN PHONG (references/locales/vi.md)."
    forbidden:
      - '"phản hồi trong N giờ" inside the FORM block. The 24-hour commitment (C035) is stated once, in contact.intro.lead. Repeating it beside the button turns one commitment into two places to keep it in sync, and the success panel describes a mail draft that has not been sent yet — a reply clock cannot start there.'
      - '"đã gửi" / "đã nhận được" — untrue; the mail client has not sent anything yet'
      - "`vui lòng`, `bạn hãy`, `quý khách`, an apology, or a pronoun in a field label"
      - "a bare vague verb as the button — lint_product flags gửi · xác nhận · tiếp tục · đồng ý · hoàn tất for vi. The button names the action it performs."
      - marketing register inside the form — hành trình, nâng tầm, bứt phá, khai phá
    slots:
      title: >-
        what this form is for. Renders as a mono uppercase eyebrow in the right
        column, visually paired with the `labels.office` eyebrow ("VĂN PHÒNG") in the
        left. A label, not a sentence: 2–4 words, no terminal period.
      nameLabel: the person's own name
      companyLabel: the organisation they are writing on behalf of — required, not a courtesy field
      emailLabel: email address
      phoneLabel: phone number — the only optional field
      messageLabel: the problem description
      messagePlaceholder: >-
        a concrete example of the kind of detail that makes a thirty-minute call
        useful rather than exploratory. Must read as an example, not an instruction.
        Renders inside the textarea at 14px, so it must survive being cut off at the
        field width on mobile — front-load the discriminating word.
      optionalLabel: >-
        the marker appended after a label that may be left empty. Rendered as
        " · <value>" in mono uppercase. Two words maximum.
      requiredNote: >-
        DELETED 2026-08-24 by decisions/drop-preform-contact-block — GM judged the
        standalone caption beside the submit button to be clutter. The key is gone from
        vi.ts; this slot is kept only so the next compile does not re-create it. The
        component's " *" suffix on required labels is unaffected and stays.
      successTitle: >-
        State what just happened, in the visitor's own terms: a draft is now open in
        their mail client, and nothing has reached us. Being wrong here costs a lead
        who thinks they are done. Renders as a 24-30px heading at the top of the panel
        that replaces the form, so it is read before anything else on the screen.
      successBody: >-
        what the visitor must still do (press send in their own client), and the
        fallback for the case where no mail client opened. Sentence one also carries the
        site's privacy line — `chưa có gì rời máy bạn`, which echoes messagePlaceholder's
        `dữ liệu không được rời nhà máy` and the home hero. That echo is load-bearing:
        a shorter successBody may not buy its length back by dropping it.
        REPAIRED 2026-08-24 (decisions/drop-preform-contact-block): the phone/email <dl>
        the fallback used to point at (`ở đầu trang`) no longer exists, and per
        docs/05-backlog.md #28 the panel now renders SITE.contact.phone/email itself,
        directly under this paragraph. The fallback therefore points DOWN, inside this
        panel (`ngay bên dưới`) — never at another part of the page, and never by
        retyping the address into vi.ts, which would fork a value that lives in
        web/content/site.ts. If a future change moves those two values out of the panel
        again, this clause is false the same day and must be recompiled.
    slots_outside_the_form_object:
      # Both live at contact.* rather than contact.form.*, but belong to this block.
      ctaPrimary: >-
        The submit button names what pressing it does, and what it does is open a
        pre-filled mail draft (decisions/submit-stays-mailto). It may not promise a
        delivery the button cannot perform. VI ceiling 28 characters
        (brand/voice.yaml ui_limits.button.vi) and lint_product rejects a bare
        gửi · xác nhận · tiếp tục · đồng ý · hoàn tất. Note home.hero.ctaPrimary now
        ships "Đặt lịch tư vấn" as a LINK TO THIS PAGE, not a mailto — CTA_HREF was
        deleted from content/site.ts, so the form is the only thing on the site that
        mails.
      media.alt: >-
        the artwork brief for the empty image slot in the success panel. Because
        `media.src` is empty, this string is PRINTED ON SCREEN under the
        `ui.imagePending` label inside a viewfinder frame, wrapped at 30ch. It is read
        by a visitor who has just submitted, not only by a screen reader. It must
        therefore describe the intended photograph in a register a customer can read.
        DECIDED: the Landmark 72 office (decisions/success-panel-image). Written as
        an art-direction brief a customer can read without embarrassment, and it must
        still work unchanged as the alt attribute once the photograph lands. Numbers
        in the address are safe HERE and only here, because check_claims skips number
        checks on a product_ui artifact.

chrome:
  meta:
    contact:
      title: >-
        page title. Must distinguish this page from meta.home.title, which already
        carries the company positioning. Claim cover: C019 if the entity relationship
        is stated. No number may appear that the ledger does not carry.
      description: >-
        search-result description. The checkable facts — the Hà Nội office, the tax
        code and the two channels — are what this page has that the others do not.
        DECIDED: carry the tax code 0111545175 (decisions/meta-tax-code). It is the
        ONLY figure the ledger licenses here, via C019. The street address stays out:
        Landmark 72 and floor 19 are numbers with no ledger entry and this artifact
        is marketing, so check_claims would reject them.

