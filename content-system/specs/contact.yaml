  - id: intro-lead-measurement
    status: OPEN — a measurement, not a question
    question: >-
      At 1440x900, does the phone/email <dl> stay above the fold with the
      two-sentence lead applied?
    owner: the calling session
    blocks: [contact.intro.lead]
    note: >-
      The one-sentence fallback is the applied lead's FIRST SENTENCE ALONE, verbatim:
      "Ba điều nên nói trước: máy móc hay dây chuyền nào, tín hiệu nào đang đo được,
      dữ liệu có được phép rời tổ chức không." Swapping it needs no recompile.
      Estimated at 1440x900 from the CSS: budget 836px (900 minus a 4rem header),
      content roughly 520-570px — py-24 192, kicker 32, h1 48 per line, lead 104,
      dl 142. It should fit comfortably; the estimate is not a measurement. Why Now was measured at 922px with no prose at all before it lost
      `screen` (docs/03-structure.md §3) — this block has still never been measured.

  - id: office-photograph
    status: OPEN — content decided, asset missing
    question: The Landmark 72 photograph itself.
    owner: GM — docs/05-backlog.md #5, G9
    blocks: [contact.media.alt]
    note: >-
      contact.media.alt is written to survive the transition: it reads as an
