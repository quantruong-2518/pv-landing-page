# Semantic spec — PRODUCTS (/vi/products). Language-free by design.
#
# This is the ONLY input a locale writer may read. It exists so that `en` and `ko`
# can later be written natively from the same meaning instead of being translated
# out of `vi`, which the content-i18n skill forbids in both directions.
#
# Compiled 2026-08-23. Sources: docs/01-proof-bank.md §D §E, docs/02-message-map.md,
# docs/03-structure.md §1, context/02-products/**, content-system/claims/approved.yaml.
#
# Reading rule inherited from specs/home.yaml, unchanged:
#   docs/ and context/ are written ABOUT the page. They are not the page. Read them
#   for FACTS, never for editorial framing. context/02-products/ carries English
#   sentence shape (docs/05-backlog.md #16b) — MATERIAL, not copy.
#
#   A `body` earns its place only by adding a FACT its `title` does not carry.
#   No such fact -> leave it empty. Components skip empty strings by design.

id: products
type: marketing

contract:
  page:
    type: catalogue
    goal: let a buyer locate themselves in the catalogue and see which entries are real today
    funnel_stage: consideration
  audience:
    primary: Vietnamese industrial and enterprise buyers; Korean FDI firms in Vietnam
    buyer: plant, IT or procurement decision-maker
    evaluator: engineer — checks whether a number names what it was measured against
    awareness_level: problem-aware, arrived from the homepage or from search
    primary_problem: they cannot tell which of these is a shipping part and which is a slide
  product:
    name: Pebble Vina catalogue
    category: Edge AI silicon from the parent, plus the compute and software layer built locally
    structure:
      - hardware — MINT, PAPAYA FLEX, ESPRESSO from Pebble Square; GPU/HPC integrated by Pebble Vina
      - software — enterprise software and Private AI, both built by Pebble Vina
    constraints:
      - the parent designs anomaly detection and predictive maintenance, not arc-fault or solar PV
      - ESPRESSO is not shipping and is absent from the parent's public catalogue
      - no customer, deployment, distribution agreement or revenue figure is verified — C030
  proof:
    verified: [C002, C003, C004, C005, C006, C007, C014, C016, C021, C024, C026, C027]
    contextual: [C015, C017, C018, C030]
    unavailable:
      - any GPU vendor name, distribution agreement or reseller relationship — docs/05-backlog.md #18
      - enterprise software platform base, and any customer running it — docs/05-backlog.md #17
      - how far Build and Train/Adapt actually go in practice — context/02-products/2.2-software/private-ai.md
  differentiators:
    - the catalogue spans a sensor's milliwatt budget through training-scale GPU, from one supplier
    - each entry states whether it ships today, and each number names what it was measured against
  objections:
    - is this real silicon or a slide
    - a chip this small cannot be doing what a GPU does
    - what happens to my data
  cta:
    primary: book a consultation
  tone:
    desired: [precise, understated, engineer-readable, honest about status]
    avoid: [luxury language, emotional hype, startup clichés, claiming the parent's work as ours]
  claims_policy:
    allow_inference: false
    require_proof_for_numbers: true
    require_proof_for_superlatives: true
  locale:
    requested: [vi]
    deferred: [en, ko]
    note: >-
      web/ ships `vi` only since 2026-08-23. When `en` or `ko` is written it must be
      compiled from THIS spec, never translated from `vi.ts`.

# ── Decisions taken by the requester, 2026-08-23 ─────────────────────────────
decisions:
  enterprise_software:
    question: packaged product or project service — docs/05-backlog.md #17
    answered: packaged product
    but: no customer is running it yet
    consequence: >-
      Modules may be described by what the product DOES (feature tense). Nothing may
      imply a deployment, a customer, a count or a track record. C030's qualification
      still binds: capability tense for anything Pebble Vina builds.
    still_open: [platform base, which model powers best-next-action, where its data sits]

  espresso_date:
    question: >-
      how is the ESPRESSO milestone dated, given a September 2026 date stops reading as
      a citation on 1 October 2026 — open_decisions/espresso-date, raised 2026-08-24
    answered: keep `dự kiến 9/2026` and name the investor material as the source, every mention.
    but: the date goes stale in about five weeks and nothing here renews it.
    consequence: >-
      The date and the source travel together in `statusNote` and in the spec `source`,
      exactly as home.history.milestones[14] already ships them. A deadline line goes into
      docs/05-backlog.md so the page is re-read in early October rather than rotting quietly.
    still_open: [the date itself once HQ confirms or moves it — GM, docs/05-backlog.md #9]

  papaya_size_number:
    question: >-
      may PAPAYA FLEX state the ~25x package-size advantage — the figure is in
      docs/01-proof-bank.md §E2 but no claim id carried it
    answered: yes. The ledger was stale, not the fact.
    but: the proof bank is the authority and the ledger is its projection (content-system/README.md).
    consequence: >-
      C034 was added to content-system/claims/approved.yaml mirroring §E2 row 3 —
      10x10 mm against 70x45 mm, IR Deck. Same rule as C005 and C006: the counterparty
      is named or the number does not ship.
    still_open: []

  papaya_pair:
    question: >-
      PAPAYA and PAPAYA FLEX were two blocks, one of them empty — docs/05-backlog.md #33/#34
    answered: >-
      one block, presented as a pair ("thông tin đôi"). GM, 2026-08-24, recorded in
      docs/03-structure.md §1. Surviving anchor `papaya-flex`; the standalone `papaya`
      entry is deleted from web/content/vi.ts, not left empty.
    but: >-
      the STRUCTURAL decision is closed; the PRODUCT FACT under it is not. The proof bank
      never says what PAPAYA is relative to PAPAYA FLEX — §D lists the family as
      MOCHA → MINT → PAPAYA FLEX and §E2 carries one bare-PAPAYA row. GM's reading (family
      name / lower performance tier) lives in docs/05-backlog.md #34, which is not a proof
      bank row and has no claim id.
    consequence: >-
      The copy names each part by WHAT IT WAS MEASURED ON — sourced directly from §E2 — and
      says nothing about how the two relate. The pairing is carried by the structure GM chose:
      one block, one application rail, four labelled numbers. The tagline stays tier-neutral.
      The heading is renamed — see open_decisions/papaya-pair-heading (resolved).
    still_open: [papaya-pair-relationship]

  kicker_numbering:
    question: is products.intro.kicker an index number like home's `01 · …`
    answered: numbered. `2.1` and `2.2` are the section indices the structure doc already uses.
    inherited_from: specs/contact.yaml decisions/kicker-numbering — which dropped numbering on CONTACT only
    but: contact dropped its number because it is a leaf page; the catalogue has a real hierarchy to signal.
    consequence: >-
      products.intro.kicker orients without a number (it is the page opener, not a section),
      while products.hardware.kicker and products.software.kicker carry `2.1` and `2.2` —
      the same labels docs/03-structure.md §1 uses, so the page and the doc read alike.
    still_open: []

# ── What the first written pass got wrong, 2026-08-24 ──────────────────────
revision_log:
  - slot: all prose slots
    was: >-
      composed by shortening the Vietnamese drafts in context/02-products/, which carry
      English sentence shape (docs/05-backlog.md #16b). Six bodies ran three to four
      sentences; the longest was 75 words in a left column beside a figure.
    is: >-
      composed from the slot briefs in this file, in Vietnamese, then checked against the
      drafts for FACTS only. 37 strings rewritten. Body average fell 21.1 -> 15.0 words,
      longest 75 -> 32, bodies of three or more sentences 6 -> 0.
  - slot: products.software.groups[1].tagline
    was: '`Mô hình của bạn, dữ liệu của bạn, hạ tầng của bạn` — a calque of "Your model, your data, your infrastructure"'
    is: '`Chạy sau tường lửa của bạn` — names the mechanism a buyer is actually asking about'
  - slot: products.software.groups[0].name and tagline
    was: '`Phần mềm doanh nghiệp tối ưu bằng AI` / `Hệ thống lõi, dựng lại quanh mô hình` — participle-modifier shapes borrowed from English'
    is: '`Phần mềm doanh nghiệp` / `CRM, ERP · mô hình đặt tại chỗ` — the name is plain, the tagline carries the one differentiator'
  - slot: products.hardware.items[3].tagline
    was: '`Lớp tích hợp của Pebble Vina · phần cứng thương mại` — repeats the OriginTag rendered directly above it'
    is: '`Khi bài toán vượt quá chip edge` — tells a reader in the catalogue index when to click this entry'

# ── Length law and sourcing rule — added 2026-08-24, second pass ────────────
# The first written pass inherited sentence shape from context/02-products/ in 24 slots
# and produced six bodies of three to four sentences (75, 60, 54, 49, 44, 44 words).
# Measured on the built page; the requester rejected it as long and hard to read.
#
# RULE 1 — context/ is MATERIAL, never a draft to shorten. A Vietnamese sentence is
# composed from this spec's slot brief, in Vietnamese, and only then checked against the
# drafts for FACTS. `Mô hình của bạn, dữ liệu của bạn, hạ tầng của bạn` is what the other
# direction produces: a calque of "Your model, your data, your infrastructure" that reads
# as a translated slogan. docs/05-backlog.md #16b, and no script catches it —
# LOCALE_TRANSLATIONESE is reviewer-only.
#
# RULE 2 — budgets. A slot over budget is not "rich", it is unread: each product block is
# one scan unit in a left column beside a figure.
length_budget:
  product_body:      { sentences: 2, words: 32, first_sentence_words: 18 }
  capability_body:   { sentences: 1, words: 12, note: one checkable fact, not a sales line }
  section_lead:      { sentences: 1, words: 20 }
  intro_lead:        { sentences: 1, words: 18, note: "height:screen — measured, see the loop notes" }
  tagline:           { words: 7, note: renders mono uppercase; a label, never a slogan }
  spec_note:         { note: a data line, not prose — figures first, method second }
  never_rewritten:   [product names, figures, units, source citations, capability titles]
  # Capability titles stay: they map to the six business sectors Pebble Square publishes
  # (docs/01-proof-bank.md §D). Rewriting them would drift from the parent's own taxonomy.

blocks:

  - id: products.intro
    height: screen
    intent:
      communicate: the catalogue has two layers, and the reader can jump straight to their own
      reader_question: what do these people actually sell
    claims: []
    qualifiers:
      - this block is one viewport tall — prose added here overflows it (docs/03-structure.md §3)
    forbidden:
      - repeating the energy thesis the homepage owns
      - listing product names here; the two nav cards already carry them
    slots:
      kicker: page index
      headline: the span of the catalogue in one line — silicon at one end, software at the other
      lead: how the catalogue is split and how status is marked, in one sentence

  - id: products.hardware
    height: content
    intent:
      communicate: three parts from the parent plus one integration layer built locally
      reader_question: which of these can I buy
    claims: [C030]
    qualifiers:
      - three entries are the parent's silicon; the fourth is Pebble Vina's integration layer
    slots:
      kicker: section index
      headline: what the hardware line covers
      lead: whose silicon, and where the local layer starts

  - id: products.hardware.mint
    origin: ps
    status: shipped
    claims: [C002, C003, C004, C024, C026, C027, C014]
    intent:
      communicate: the part that is actually in mass production, and the two application classes it has been proven in
      reader_question: is there real silicon
    mechanisms:
      - a crossbar array computes in the analog domain inside embedded flash
      - a 256-state synaptic cell gives 8-bit precision
      - FCNN, CNN, DNN and RNN run on the device itself
    qualifiers:
      - never attribute arc-fault or solar PV to this part
    slots:
      name: product name, verbatim
      tagline: architecture and generation
      body: what it is for, and the one status fact that separates it from a prototype
      capabilities:
        - sensor AI — evidence is the Home IoT NDA of March 2024
        - voice AI — evidence is the February 2024 PoC
        - ultra-low-power edge AI — the mechanism, stated as mechanism
      specs:
        - value: energy efficiency, the backbone number
          must_carry: [architecture, throughput, die size, measured on real silicon, mass production date]

  # ONE block for both names since 2026-08-24 — docs/03-structure.md §1, backlog #33/#34.
  # The anchor stays `papaya-flex`; the standalone `papaya` entry is deleted, not emptied.
  - id: products.hardware.papaya
    origin: ps
    status: shipped
    claims: [C005, C006, C007, C034, C016]
    intent:
      communicate: >-
        the vision part, the honest shape of its advantage, and which of the two
        names each measured number belongs to
      reader_question: how can something this small beat a GPU — and what is PAPAYA next to PAPAYA FLEX
    mechanisms:
      - the same analog-PIM architecture applied to image workloads
    qualifiers:
      - every multiple must name its counterparty — C005, C006, C007, C034
      - C006 must name ResNet-50; C007 applies to the AI task at the base station, not the station
      - the advantage is power and size, not general superiority — say so plainly
      - >-
        each spec label names WHICH of the two parts it measured. §E2 attributes three
        rows to PAPAYA FLEX and one to bare PAPAYA; a merged block that hides that is
        worse than two blocks, not better.
    forbidden:
      - a bare multiple with no counterparty
      - implying it replaces a GPU for training
      - >-
        stating the RELATIONSHIP between the two names as fact — family, tier, same die,
        one entry point. See open_decisions/papaya-pair-relationship. The proof bank carries
        no such row and the ledger no such id; only what each number was measured on may be said.
      - inventing a tier scheme or a name the parent has not published
    slots:
      name: >-
        product name, verbatim. `PAPAYA · PAPAYA FLEX` — open_decisions/papaya-pair-heading
        closed by GM, 2026-08-24 (main session).
      tagline: architecture and the scale it operates at — true of both parts, names neither
      body: >-
        which of the two names each number was measured on, then the limit of the
        comparison stated by us before the reader finds it
      capabilities: [vision AI, camera, inspection, robotics]
      specs:
        - value: power multiple, PAPAYA FLEX against the named counterparty
        - value: efficiency multiple, PAPAYA FLEX — must name ResNet-50
        - value: package-size multiple, PAPAYA FLEX — C034
        - value: multiple for the AI task at a 5G base station, PAPAYA
      spec_strip:
        order: the three PAPAYA FLEX rows first, the PAPAYA row last — grouped by part, not by axis
        count: >-
          four. docs/05-backlog.md #34 (GM, 2026-08-24) puts all four §E2 rows in this one
          block. At `lg` the strip renders two columns, so four is two balanced rows and
          three would leave an orphan; the choice is 2 or 4, never 3.
        height_cost: >-
          measured 2026-08-24 after apply — see revision_log. The block is `height: content`,
          so a taller strip costs page length, not an overflow.
        source_line: >-
          all four carry the same vendor-published caveat. One row without it implies the
          other three were verified independently.

  - id: products.hardware.espresso
    origin: ps
    status: roadmap
    claims: [C017]
    intent:
      communicate: the second architecture branch, and that it is not a thing anyone can buy yet
      reader_question: when can I have it
    mechanisms:
      - digital-PIM on SRAM, a different branch from the analog-PIM of MINT and PAPAYA
    qualifiers:
      - CLAUDE.md §2 rule 4 — amber label AND the investor-material source, every single mention
      - absent from the parent's public catalogue as verified 2026-08-20
    forbidden:
      - any phrasing that reads as available, shipping, or offered
    slots:
      name: product name, verbatim
      tagline: architecture branch and the workload class it targets
      body: what it is meant for, and its status said out loud rather than left to the badge
      status_note: expected date and the fact that the source is investor material
      capabilities: [large-model inference, AI accelerator, AI server and infrastructure]
      specs:
        - value: throughput at INT8
          must_carry: [power draw, efficiency, four-chip card total, in-house LLM parameter ceiling]

  - id: products.hardware.gpu
    origin: pv
    status: shipped
    claims: [C030, C018]
    intent:
      communicate: the honest boundary — edge silicon does not solve training, and we say what does
      reader_question: what if my problem is not an edge problem
    qualifiers:
      - this is Pebble Vina's integration layer, not the parent's catalogue
      - capability tense only; no vendor name, no distribution agreement, no customer — C030
    forbidden:
      - naming a GPU vendor or implying a reseller relationship — docs/05-backlog.md #18
      - implying PIM silicon covers training
    slots:
      name: the layer, named plainly
      tagline: whose layer it is and what class of parts it uses
      body: why this branch exists at all — stated as the limit of the other three
      capabilities: [GPU products, AI training, large-scale inference, HPC, AI data centre]
      specs: none — nothing here is measured or published

  - id: products.software
    height: content
    intent:
      communicate: the layer Pebble Vina builds on top, and that it is local work
      reader_question: is there anything above the chip
    claims: [C030]
    qualifiers:
      - both groups are Pebble Vina's own work, tagged pv
      - capability tense — C030
    slots:
      kicker: section index
      headline: what the software line covers
      lead: whose work this is and what connects it to the hardware line

  - id: products.software.enterprise
    origin: pv
    claims: [C015, C030]
    intent:
      communicate: systems of record that can run against a model the customer hosts
      reader_question: why would I take this over the CRM I already know
    mechanisms:
      - the model the software calls can sit inside the customer's own infrastructure
    qualifiers:
      - packaged product per the 2026-08-23 decision — modules may state what they do
      - no customer, no deployment, no count — nothing in achievement tense
      - the platform it is built on is unknown and must not be implied — docs/05-backlog.md #17
    forbidden:
      - naming a base platform or partner
      - any phrase implying organisations are already running it
    slots:
      name: the group, named plainly
      tagline: the one property that separates it from any other suite
      body: the single connection that justifies this block existing at all
      modules: [CRM, ERP and operations, workflow, data and reporting, AI agent]

  - id: products.software.privateAi
    origin: pv
    claims: [C014, C015, C018, C030]
    intent:
      communicate: the answer to "can we run AI without our data leaving" and the hardware under each option
      reader_question: does my data leave the building
    mechanisms:
      - inference completes without a network round trip — C014
      - a model placed inside the customer's own infrastructure keeps data and weights behind their firewall
    qualifiers:
      - C015 holds only for the on-premise deployment model — carry the condition
      - C018 splits — a commercial-GPU configuration today, the ESPRESSO configuration on roadmap
      - how far Build and Train/Adapt go is unverified; state them as stages, not as guarantees
    forbidden:
      - an unconditional promise that data never leaves
      - presenting the ESPRESSO configuration as available
    slots:
      name: the group, named plainly
      tagline: ownership, said in three beats
      body: the deployment claim with its condition attached, and the two configurations split
      modules: [build, train and adapt, deploy]
      targets_title: label for the deployment ladder
      targets:
        - on-device — MINT sits under it
        - edge — PAPAYA FLEX sits under it
        - on-premise — GPU today, ESPRESSO on roadmap
        - private cloud — GPU
        - GPU and AI infrastructure — GPU and HPC
      note: >-
        The five targets are ordered by power budget and each has real hardware behind
        it. That ladder is the strongest structural argument on the page.

chrome:
  ui:
    specs: label above the measured-number strip
    source: label prefixing a citation
    image_pending: placeholder text where artwork is not yet supplied
  origin:
    ps: the part came from the parent
    pv: the part is Pebble Vina's own layer
  meta:
    products: title and description for the catalogue page

open_decisions:
  - id: papaya-pair-relationship
    blocks: >-
      saying out loud what the reader is left to infer — that PAPAYA and PAPAYA FLEX are
      two performance levels of one chip line, which is GM's own stated reason for merging
      the block (docs/05-backlog.md #34).
    owner: GM
    route: >-
      docs/01-proof-bank.md §D or §E2 gains one row naming what "PAPAYA" is, with its source;
      content-system/claims/approved.yaml mirrors it as a new id. Then TWO keys regenerate —
      products.hardware.items[1].tagline and .body — and nothing else moves.
    until_then: >-
      the copy states only what §E2 measured on which part. No family, no tier, no "cùng một
      dòng chip" anywhere on the page.

  - id: papaya-pair-heading
    blocks: >-
      whether the merged block's heading becomes `PAPAYA · PAPAYA FLEX`, the notation
      docs/03-structure.md §1 itself uses for the pair.
    owner: GM — a one-line change to products.hardware.items[1].name
    argument_for: >-
      the same string renders in three places (block h3, catalogue index card, header
      dropdown). A buyer who arrived looking for PAPAYA does not find the word in the index
      at all today; they meet it first inside a spec label, halfway down the block.
    argument_against: >-
      it is a name change with page-wide reach and it was not in the work order that
      commissioned this run. Names are `never_rewritten` in this file's length_budget.
    resolved: >-
      GM, 2026-08-24 (main session) — rename to `PAPAYA · PAPAYA FLEX`, matching
      docs/03-structure.md §1's own notation. Applied to
      products.hardware.items[1].name in web/content/vi.ts and mirrored in
      content-system/output/products.vi.json.

  - id: enterprise-platform-base
    blocks: naming what the suite is built on
    owner: GM — docs/05-backlog.md #17
  - id: gpu-vendor-naming
    blocks: saying anything more specific than integration capability
    owner: GM — docs/05-backlog.md #18
  - id: espresso-date
    status: ANSWERED 2026-08-24 — see decisions/espresso_date
    inherited_from: specs/home.yaml
    note: >-
      Same conflict, same deadline. A September 2026 date stops reading as a citation
      on 1 October 2026. docs/05-backlog.md #9. The requester chose to keep the date
      and carry the source with it; the deadline is now a backlog line, not a silent risk.

# ── Gate F, second pass — closed 2026-08-24 ────────────────────────────────
# The spec above was compiled 2026-08-23 and read back to the requester on 2026-08-24
# before any prose was written. Three questions were open at that reading; all three are
# recorded in `decisions:` above. Scope of the writing run this confirms:
scope:
  written:
    - meta.products.title
    - meta.products.description
    - products.intro.{kicker,title,lead}
    - products.hardware.{kicker,title,lead}
    - products.hardware.items[0..3].{name,tagline,body,capabilities[].{title,body},specs[].*,media.alt}
    - products.software.{kicker,title,lead}
    - products.software.groups[0..1].{name,tagline,body,modules[].{title,body},media.alt}
    - products.software.groups[1].{targetsTitle,targets[].{title,body}}
    - ui.{specs,source,imagePending}
    - origin.{ps,pv}
  held: []
  note: >-
    `status`, `origin`, `id` and `starred` are not content and are not touched by the apply
    (CLAUDE.md §3b). ui.* and origin.* are chrome shared with HOME and CONTACT — writing them
    here also clears the `ui-imagePending-placeholder` finding in specs/contact.yaml.

# ── Repair run — PAPAYA pair, 2026-08-24 ───────────────────────────────────
# Not a page rewrite. The requester's decision was structural (docs/03-structure.md §1);
# what needed writing was the block's own copy plus the deletion of the empty entry.
# Artifact: content-system/output/products.papaya-pair.vi.json (and products.vi.json,
# kept in sync so the page artifact still matches what ships).
repair_2026_08_24_papaya_pair:
  regenerated:
    - products.hardware.items[1].body
    - products.hardware.items[1].specs[0].{label,note,source}
    - products.hardware.items[1].specs[1].*        # new — efficiency, ResNet-50
    - products.hardware.items[1].specs[2].*        # new — package size, C034
    - products.hardware.items[1].specs[3].{label,source}   # the 5G row, moved from specs[1]
  deleted:
    - products.hardware.items[] entry `id: papaya` — emptied block, no copy, no numbers
  untouched_on_purpose:
    - products.hardware.items[1].name          # open_decisions/papaya-pair-heading
    - products.hardware.items[1].tagline       # tier-neutral already; see below
    - products.hardware.items[1].capabilities[].*   # the rail is out of this run's scope
    - products.hardware.items[1].media.alt
    - products.hardware.items[1].specs[3].note      # already carries C007's qualification
    - products.hardware.{title,lead}           # "Ba con chip" becomes exactly true after the merge
  measured_after_apply: >-
    1440×900 and 1280×800, production build, CSS confirmed loaded (--header-h resolves):
    #papaya-flex = 855px, page = 6404px, no horizontal overflow. The reference in
    docs/07-loop/products.md for the same block with two numbers was 748px at 1428×893,
    so the two extra SpecCards cost +107px and the block now sits just over the 829px
    one-screen budget — inside the "~860px ≈ vừa một màn" figure docs/03-structure.md §3
    itself uses, and the block is `height: content`, so nothing overflows. Below `lg` the
    strip is a horizontal snap rail in the layout as built on 2026-08-24, not a stack, so
    the two extra cards cost no vertical height there. Mobile belongs to mobile-ui-reviewer
    on a real browser (CLAUDE.md §7); headless emulation below 500px was not trustworthy
    in this run and no mobile number from it is recorded here.
  tagline_note: >-
    `Analog-PIM · thị giác máy ở mức miliwatt` survives the merge unchanged because it is
    already true of both parts (§D puts the family on Analog-PIM; §E2 measures 0,1–0,15 W
    and 0,03 W — both milliwatt-class) and it names neither. Every rewrite that signalled
