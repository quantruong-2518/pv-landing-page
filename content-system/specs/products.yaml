presentation:
  opener:
    height: screen
    structure: headline plus six decision tiles grouped into hardware, software and training
    signature: a selection matrix encoding category, use and maturity in the same tile
    motion: a restrained arrow shift on hover and focus; disabled by prefers-reduced-motion
    mobile_constraint: two compact tile columns; all six destinations remain reachable without horizontal scrolling
  catalogue:
    order: [hardware lead, MINT, PAPAYA family, ESPRESSO, E-Series E10 and E20, software lead, enterprise suite, training lead, enterprise AI training]
    product_rule: one hardware product per viewport target; no fixed height, clipping or filler space
    background_rule: one page canvas; no PRODUCTS section fill or alternating band
    conversion_rule: >-
      REVISED 2026-09-03 (block_cta_2026_09_03) — no form on this page. Every product block closes
      on the same button to /vi/contact, so the reader converts at the block that convinced them.

blocks:
  - id: products.intro
    height: screen
    intent:
      communicate: the catalogue has hardware, software and training branches with different maturity stages
      reader_question: what products are here and where should I start
    claims: [C004, C036, C017, C030, C037, C040]
    qualifiers:
      - the maturity stage of every destination is visible in the decision map
      - the opener targets one viewport but never clips on small or zoomed screens
    forbidden:
      - a generic portfolio headline with no decision support
      - explanation of PIM or enterprise modules in the opener
    slots:
      kicker: page category
      title: the catalogue span, stated as a product choice
      lead: one instruction for using the decision map
      scroll_label: accessible action label for moving to the hardware section
      decision_entries: product names, one use cue and their visible stage
      catalog_title: >-
        heading of the catalogue strip: the two halves of what is on offer, chips and solutions.
        Stored sentence case — the component uppercases it
      catalog_lead: >-
        one line naming who builds which half, so a card is read with its maker attached.
        Must_carry: hardware belongs to Pebble Square, software and training belong to Pebble Vina.
        Never a capability or availability sentence — the stage label on each card carries maturity

  - id: products.hardware
    height: content
    intent:
      communicate: three Pebble Square chip lines plus the Pebble Square E-Series accelerator family
      reader_question: which hardware path matches my workload
    claims: [C004, C036, C017, C041, C042, C043]
    slots:
      kicker: section index
      title: hardware scope in one line
      lead: status rule for reading the four entries
      catalog_groups:
        npu: >-
          index band label for the three PIM chip families. A category signpost, not an
          architecture statement
        gpu: >-
          index band label for the E-Series accelerators, so they do not read as a fourth chip.
          Separates by FORM — accelerator card, against the NPU band's chip line — and carries no
          architecture acronym at all. See catalogue_band_gpu_relabel_2026_09_03. Also the
          `aria-label` of its `<section>`: keep it at or under the NPU band's length or it wraps

  - id: products.hardware.mint
    origin: ps
    status: shipped
    height: content
    intent:
      communicate: MINT is the production edge-AI part
      reader_question: which chip can I evaluate now for low-power edge workloads
    claims: [C002, C003, C004, C038]
    values:
      - place inference inside a field device power envelope
    qualifiers:
      - mass production started in May 2023; 2022 is the development-completion year
    slots:
      name: product name verbatim
      headline: >-
        product name, then the architecture and the workload class it is built for. Must_carry:
        the published architecture name, and that the inference happens on the device
      application_lead: name the product forms where MINT is commonly positioned, without implying deployments
      tagline: architecture, production status and workload class
      body: operational value plus the boundary of the part
      capabilities: [Smart Home, IoT, Failure Analysis]
      specs:
        - value: 17.6 TOPS/W energy efficiency
          must_carry: [30 GOPS, 5 by 5 mm die, mass production since May 2023, source]
      metrics:
        - Performance: 30 GOPS
        - Efficiency: 17.6 TOPS/W
        - Die or Chip Area: 5 by 5 mm
      media_alt: literal description of the MINT render

  - id: products.hardware.papaya
    origin: ps
    status: shipped
    status_note: customer PoC in 2024
    height: content
    intent:
      communicate: the PAPAYA family reached a customer PoC for vision and security workloads
      reader_question: how mature is the vision-AI line
    claims: [C036]
    qualifiers:
      - PoC is not mass production or general availability
      - do not name or imply a customer
      - the number belongs to PAPAYA; do not silently move it to PAPAYA FLEX
    forbidden:
      - present-tense availability
      - PAPAYA FLEX comparison multiples in the foreground
    slots:
      name: PAPAYA and PAPAYA FLEX family name
      headline: >-
        both names, then one clause: the shared architecture and the vision workload class the
        family is built for. Two parts under one name, so the noun is a family, not a single chip.
        No availability tense — the PoC badge sits under it
      application_lead: name vision, image-recognition and security product forms at the customer-PoC boundary
      tagline: customer-PoC status, year and workload class
      body: what the PoC established and what it did not establish
      capabilities: [Image Recognition, Vision Recognition, Security System]
      specs:
        - value: 30 TOPS/W efficiency
          must_carry: [0.5 TOPS, 5 by 5 mm die, customer PoC in 2024, investor source]
      metrics:
        - Performance: 0.5 TOPS
        - Efficiency: 30 TOPS/W
        - Die or Chip Area: 5 by 5 mm
      media_alt: literal description of the PAPAYA family render

  - id: products.hardware.espresso
    origin: ps
    status: roadmap
    status_note: Q3 2026; investor material; absent from the public catalogue
    height: content
    intent:
      communicate: ESPRESSO is the dated Digital-PIM direction for larger workloads
      reader_question: what comes after edge inference and when
    claims: [C017, C039]
    qualifiers:
      - every mention carries roadmap, Q3 2026 and investor-material attribution
      - applications are targets, never present capabilities
    forbidden:
      - available or shipping tense
      - describing a render as production silicon
    slots:
      name: product name verbatim
      headline: >-
        product name, then the PIM branch and the machine class it is aimed at. A target, not a
        capability: the roadmap badge and the dated tagline sit immediately below it in the same
        band, and the headline may not be rendered anywhere they do not follow it
      application_lead: name roadmap targets only, with Q3 2026 in the same sentence
      tagline: Digital-PIM branch, workload span and roadmap date
      body: direction of travel plus current unavailability
      capabilities: [AI PC, Robotics, Data Center]
      capability_titles: the target machine class, bare — the date is no longer inside the title
      capability_date_note: >-
        the roadmap date, once per card, in its own field under the title. Identical on all three
        cards; compiled once as products.shared.dateNotes.espresso
      capability_media_alt: >-
        one literal visual description per application card — object, then two physical details,
        the shape the ten MINT and PAPAYA application alts already use. These three renders are
        generic machine classes, NOT ESPRESSO hardware: the alt may not name ESPRESSO, may not say
        a machine runs it, and may not imply it is built. It states no claim and carries no status
        label; the card's dateNote does that. See espresso_capability_alts_2026_09_03
      specs:
        - value: 160 TOPS at INT8
          must_carry: [16 TOPS/W, 20 by 23 mm package, 640 TOPS four-chip card, investor source, roadmap date]
      metrics:
        - Performance: 160 TOPS at INT8
        - Efficiency: 16 TOPS/W
        - Die or Chip Area: 20 by 23 mm
      media_alt: describe the ESPRESSO image as a roadmap render

  - id: products.hardware.gpu
    origin: ps
    status: shipped
    height: content
    intent:
      communicate: E-Series extends the catalogue from edge silicon to training and inference accelerators
      reader_question: which E-Series tier matches the workload scale
    claims: [C041, C042, C043, C044]
    qualifiers:
      - product data and ownership are confirmed by the GM-supplied E-Series material
      - do not imply general availability, inventory, customer or deployment count
    slots:
      name: E-Series AI Compute Accelerators
      headline: >-
        family name, then what the hardware accelerates and the two scales it runs at.
        Must_carry: the deployment scale, single machine through multi-card system. No availability,
        inventory or deployment implication
      application_lead: enterprise AI server, LLM training and inference, vision, NLP, speech and multi-card computing
      tagline: GP-DSA for training and inference
      body: one architecture from FP32 to INT4 with PCIe 5.0 and RDMA
      variants:
        - E10 PCIe:
            application_lead: balanced enterprise-server deployment
            metrics: [32 AI cores with precision figures, 48 GB memory, PCIe and RDMA connectivity]
        - E20:
            application_lead: larger models and distributed AI infrastructure
            metrics: [64 AI cores with precision figures, 96 GB memory, dual PCIe and denser RDMA connectivity]
      software_stack: [AI Compiler, Graph Optimization, Operator Generation, Performance and Precision Tools, Framework Compatibility]
      capabilities: [Enterprise AI Server, LLM Training and Inference, Computer Vision, NLP and Speech AI, Multi-card Computing]
      media_alt: >-
        one literal product-image brief per accelerator. The catalogue card reuses the E10 file,
        so items[3].media.alt is the E10 description verbatim — same image, same words, and the
        two may not be made to differ. See e_series_catalogue_alt_2026_09_03

  - id: products.software
    height: content
    status: roadmap
    status_note: December 2026
    intent:
      communicate: one Pebble Vina enterprise suite is planned above the hardware catalogue
      reader_question: what software layer is coming and when
    claims: [C037]
    qualifiers:
      - roadmap date appears in the band and product block
    slots:
      kicker: section index
      title: enterprise software category and roadmap status
      lead: scope of the suite in one line

  - id: products.software.enterprise
    origin: pv
    status: roadmap
    status_note: December 2026
    height: content
    intent:
      communicate: one operating view joins core records and AI-assisted next actions
      reader_question: what will the suite monitor and what remains under human control
    claims: [C037]
    mechanisms:
      - CRM ERP HRM and DMS feed one operations view
      - AI proposes and coordinates; a person approves
    qualifiers:
      - roadmap December 2026 at every mention
      - DMS means Document Management System
      - no customer, deployment, platform, full autonomy or result claim
    slots:
      name: product category
      headline: >-
        the software category in one line: what it joins, and for whom. Names the product class,
        never a base platform, a customer or a result. The December 2026 roadmap date stays on the
        tagline and the badge directly beneath it
      tagline: roadmap date plus the human-approval boundary
      body: how the four systems and operations view connect
      modules:
        - CRM: customer records and sales activity
        - ERP: orders inventory purchasing and operations
        - HRM: workforce records and work allocation
        - DMS: document control and retrieval
        - AI operations centre: cross-module monitoring and proposed next actions for human approval
      media_alt: literal brief for the enterprise-suite interface; image remains pending

  - id: products.training
    height: content
    status: roadmap
    status_note: needs survey in 2027
    intent:
      communicate: enterprise AI training is a separate research-stage service direction
      reader_question: is there a standard course I can buy now
    claims: [C040]
    qualifiers:
      - 2027 is a needs-survey milestone, not a training launch
      - no fixed curriculum, class date, fee, certificate or result exists
    slots:
      kicker: >-
        section index — the bare category noun and its number, nothing else. It may not repeat a
        word sequence from offer.headline, which sits one line below it in the same band and at
        the same visual weight. See training_kicker_2026_09_03
      title: enterprise AI training category
      lead: survey-first boundary in one line

  - id: products.training.enterprise
    origin: pv
    status: roadmap
    status_note: needs survey in 2027
    height: content
    intent:
      communicate: any later programme would be shaped around a specific enterprise problem and assessed against agreed output indicators
      reader_question: what would make this different from a fixed theory course
    claims: [C040]
    mechanisms:
      - survey the enterprise problem and capability gap first
      - design practice around that context instead of a fixed syllabus
      - agree ROI indicators before delivery and use them to assess output
    qualifiers:
      - assessment does not guarantee positive ROI or a numeric return
      - delivery timing remains undecided after the 2027 survey
    slots:
      name: service direction
      headline: >-
        what the training is organised around — the enterprise's own need, not a syllabus.
        It may not name a course, a schedule or an outcome
      tagline: visible 2027 survey stage and custom-design boundary
      body: distinguish the planned survey from a course already available
      callout_note: >-
        one boxed line stating what the 2027 milestone is spent on. Must_carry: the year, and that
        the work in it is research and programme design. Never a launch, a class, a fee or a result
      principles:
        - survey the enterprise problem before programme design
        - design for a company-specific use case, not a fixed curriculum
        - use applied work rather than theory-only delivery
        - assess output using ROI indicators agreed before delivery without promising the result

  - id: products.contact
    height: content
    status_note: >-
      RETIRED 2026-09-03 (decisions/final_conversion_retired_2026_09_03). The embedded form and its
      follow-up header are gone; the block below is kept as the record of what the page used to do
      and why it stopped. Nothing here is written or applied.
    intent:
      communicate: submit the selected product need without leaving the catalogue
      reader_question: how do I start the consultation now
    qualifiers:
      - reuse the contact form fields and behaviour; do not create a second form implementation
      - do not render contact.intro, contact.form.title or contact.media on PRODUCTS
      - preserve validation, mail-client handoff, success state and contact fallback
    slots:
      follow_up_kicker: RETIRED — products.followUp.kicker is emptied and out of the contract
      follow_up_title: RETIRED — products.followUp.title is emptied and out of the contract
      form: RETIRED — the form is reached through the block CTA, on /vi/contact

  - id: products.cta
    height: content
    intent:
      communicate: the one action the page asks for, repeated at the end of every product block
      reader_question: I have found my branch — what now
    qualifiers:
      - one label for all three block types; the buyer decides at the block that convinced them
      - it asks for a consultation, not a purchase, and promises nothing about what follows
      - no urgency the market did not create
    forbidden:
      - a second competing action on the same page
      - implying a demo, a quote, a trial or a delivery date
    slots:
      cta_label: >-
        the button on every hardware, software and training block. Ceiling 28 characters
        (brand/voice.yaml ui_limits.button.vi). APPLIED 2026-09-03 — see block_cta_2026_09_03

chrome:
  meta:
    products:
      title: identify the product catalogue and the company
      description: name the three chip lines, GPU and HPC integration, the December 2026 enterprise suite and the 2027 training-needs survey
  index_navigation:
    rule: names, use cues and stages are generated from hardware items, software groups and the training offer; no duplicate content source
  mobile_navigation:
    training_label: short label for the separate 2.3 branch

locale_scope:
  writing: [vi]
  deferred: [en, ko]

artifact:
  id: products
  path: content-system/output/products.vi.json
  apply_to: web/content/vi.ts
  repairs:
    - id: products.hardware.papaya-pair
      path: content-system/output/products.papaya-pair.vi.json
      date: 2026-08-24
    - id: products.canva-master
      path: content-system/output/products.canva-master.vi.json
      date: 2026-09-03
      note: >-
        Newest wins where the two overlap. The three ESPRESSO capability titles were repaired in
        both files; every other key in the repair is new to the page. products.ctaLabel lived
        here compiled-but-unapplied until 2026-09-03b, when the type field landed and it was
        applied from this file unchanged.
    - id: products.labels-and-alts
      path: content-system/output/products.labels-and-alts.vi.json
      date: 2026-09-03
      note: >-
        Five named keys routed back by web-ui-engineer after the Canva rebuild: the gpu band
        relabel, the training kicker, the three ESPRESSO application alts, and the E-Series
        catalogue alt brought into line with what ships. No block was recompiled.

  # Reconciliation run at apply time on 2026-09-03b, per references/core/apply.md. It is a
  # FINDING, not a repair — nothing outside the five keys above was touched.
  ledger_drift:
    checked: content-system/output/products*.vi.json against web/content/vi.ts, both directions
    differs_in_ts: >-
      16 keys carry a value in vi.ts that is not the compiled one. Eleven are content:
      hardware.lead, hardware.items[1].body, hardware.items[1].applicationLead,
      hardware.items[3].media.alt, hardware.items[3].variants[0..1].media.alt, software.kicker,
      software.groups[0].body, software.groups[0].media.alt, training.kicker,
      training.offer.body. Four are index stage labels re-punctuated for the 161px card
      (items[0..3].indexStageLabel). This repair resolves two of them — training.kicker and
      items[3].media.alt — and leaves the other fourteen for the round that owns those blocks.
    missing_from_ts: >-
      17 artifact keys have no field in vi.ts: hardware.items[1].metrics[0..1].value and the
      whole items[1].specs[0..3] set. The schema moved — PAPAYA's four comparison specs became
      variants[*].metrics[*] in the Canva rebuild. Per apply.md the entries are dropped, not
      re-added; products.papaya-pair.vi.json is now addressed to a shape that no longer exists.
    missing_from_artifact: >-
      about 37 non-empty products strings in vi.ts have no artifact entry at all. The largest
      group is the application-card rail: ten capabilities[*].media.alt strings on MINT and
      PAPAYA, plus items[1].variants[*] names, taglines, applicationLeads and metric notes. The
      spec had no capability_media_alt slot before this repair, so those ten were never
      compiled — they entered the file outside the pipeline.
    owner: >-
      GM decides whether products.vi.json is regenerated to match the page or the page is pulled
      back to the ledger. Until then the ledger is not a safe source for this page.
