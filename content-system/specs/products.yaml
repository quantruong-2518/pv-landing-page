    still_open: [removing the six fields from web/content/types.ts — web-ui-engineer]

  espresso_date_q3_2026_09_03:
    question: >-
      the Canva rebuild changed the ESPRESSO milestone to Q3/2026 in ten places; docs/05-backlog.md
      #9 records the GM choosing 9/2026 twice, on 21/08 and 24/08. The proof bank holds both — §E0
