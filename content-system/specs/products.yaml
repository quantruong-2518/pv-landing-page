      in the old list no longer exists; the HOME milestone was not audited in this round.
    still_open: [auditing the ESPRESSO milestone on HOME — a HOME round, not this one]

  catalogue_band_npu_kept_2026_09_03:
    question: >-
      the index band over MINT, PAPAYA and ESPRESSO says "Dòng chip NPU AI". NPU appears exactly once
      in the whole proof bank, at §E4 line 153, inside the market-direction phrase "GPU-centric →
      NPU/AI SoC" in a section about on-premise LLM servers — not as a name for these parts. §D calls
      the tier "PIM-based AI Chip Technologies", and home.whyPim.body teaches the reader that NPU is
      the thing PIM exists to replace (mkt-202)
    answered: keep the master's label unchanged
    but: >-
      this is a GM override of two repo rules, made with the evidence above in front of him and
      restated three times: "không dựa vào context nữa, cứ theo canva làm y hệt đi". It overrides
      canva_fidelity_2026_09_03 ("correct a Canva string whenever the proof bank contradicts it")
      and catalogue_band_gpu_relabel_2026_09_03 ("No band label may carry an architecture acronym
      again"). The note attached to this key in products.canva-master.vi.json defends NPU by citing
      §E4 as "the category word the IR Deck itself uses for these parts" — that citation is wrong,
      and it stays wrong in the artifact unless someone corrects the note.
    consequence: >-
      products.hardware.catalogGroups.npu is not touched. Fidelity to the master now outranks the
      band-label rule the 03/09 pass wrote for itself.
    still_open: >-
      [the sibling band. "GP-GPU Solution" was relabelled to "Card tăng tốc AI" on 03/09 by exactly
      the reasoning just overruled, so the two bands now run on opposite principles. Not reverted —
      nobody asked — but it is one string either way and the GM should be the one to call it]

  application_label_language_2026_09_03:
    question: >-
      the E-Series application rail prints five English tiles under a Vietnamese heading while
      PAPAYA's rail two blocks up is fully Vietnamese. One rule is needed for all four rails
      (mkt-214)
    answered: keep English for the technical terms Vietnamese engineers already read in English
    but: >-
      the boundary has to be written down or it drifts again next round. English survives only for
      established technical terms; everything describing a use, a place or a machine is Vietnamese
    consequence: >-
      LLM, NLP, Computer Vision and similar terms stay as they are. Labels naming a deployment or a
      device are written in Vietnamese, matching the MINT, PAPAYA and ESPRESSO rails. Independently
      of this rule, MINT's rail is corrected to the glossary's preserve_verbatim sector names —
      "Fault Analysis" not "Failure Analysis", "Home IoT" not "Smart Home" — because
      terminology/glossary.yaml is authoritative (CLAUDE.md §6) and those two are simply wrong.
    still_open: []

  cta_label_kept_2026_09_03:
    question: >-
      the six block buttons all read "Đăng ký tư vấn ngay" and land on /vi/contact, whose opener says
      "Điền form để Pebble Vina tiếp nhận bài toán" and whose submit says "Gửi thông tin". Nothing is
      registered. But the label is the master's own button text (mkt-225)
    answered: keep the master's label; align /vi/contact to it instead
    consequence: >-
      products.ctaLabel is not touched. The mismatch becomes a CONTACT finding: that page's opener
      and submit label are what move. Also settled here: six in-body CTAs are correct — the
      one-CTA-per-page rule of 24/08 is retired, as docs/03-structure.md §4 already recorded on 02/09.
    still_open: [aligning contact.intro and the submit label — a CONTACT round]

  block_kicker_per_product_2026_09_03:
    question: >-
      from PAPAYA onward a reader scrolls up to 695px at 1024×768 with no product h2 on screen, and
      all four hardware blocks print the same kicker "01 · Phần cứng". How is orientation restored
      without adding UI the master does not have (ux-201)
    answered: the kicker carries the product name, and nothing else
    but: >-
      the sticky desktop anchor nav that would also have fixed it was declined as UI outside the
      master. That half of ux-201 dies with this choice and is recorded, not carried forward
    consequence: >-
      six kickers, one per block, each just the name: MINT · PAPAYA · ESPRESSO · E-Series, plus the
      software and training blocks. The ordinal "01" goes — it printed four times without counting
      anything. The component uppercases, so store them as the proper nouns are published.
      web-ui-engineer adds an optional per-item kicker field and reads `product.kicker ?? intro.kicker`
      so the build stays green while the strings are written.
    still_open: []

  origin_tag_relation_restored_2026_09_03:
    question: >-
      OriginTag renders a bare "PEBBLE SQUARE" pill beside the status badge on all six blocks. The
      first thing a Vietnamese industrial buyer asks about an unknown company with a Korean parent is
      who invoices and who shows up when it breaks, and this pill is the only element answering it
      (mkt-213)
    answered: >-
      restore the wording backlog #25 already recorded as written on 24/08 — "Của Pebble Square" and
      "Của Pebble Vina". A later pass dropped "Của"; this is a regression, not new copy
    but: >-
      the tag may not go further than that. docs/01-proof-bank.md line 241 marks the ownership
      structure "[CẦN ĐIỀN]" and rules that the site may say "thành viên nhóm" and may NOT say
      "công ty con"
    consequence: >-
      origin.ps and origin.pv state whose capability it is, not what the corporate relationship is.
      Any wording implying a subsidiary, a distributorship or an agency is out of bounds until the
      ownership line in the proof bank is filled in.
    still_open: [the ownership structure itself — proof bank line 241, a GM/HQ question]

  e_series_badge_kept_2026_09_03:
    question: >-
      E-Series wears the green shipped badge while the badge text says only "Thông số sản phẩm" and
      §E5 forbids inferring sale status from the GM-supplied datasheet. The colour claims what the
      text does not (mkt-206)
    answered: keep it as the master drew it
    but: >-
      web/content/types.ts:16 defines two labels, shipped and roadmap, while CLAUDE.md §2 rule 1
      mandates three — `internal` was never built. That gap is what leaves a document with no public
      source wearing the same green as a chip in mass production since 5/2023
    consequence: >-
      no change on this page. The missing third label is not closed here and must not be forgotten.
    still_open: [building the `internal` label — a repo-wide decision, logged for the GM]

