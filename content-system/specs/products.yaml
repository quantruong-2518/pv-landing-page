    answered: Q3/2026, reversing both earlier decisions
    but: >-
      this buys no time. Q3 ends 30/09, which is the same clock backlog #9 already set at 01/10/2026
    consequence: >-
      no string changes — the page is already consistent at 10/10. docs/05-backlog.md #9 is updated
