# Semantic spec — PRODUCTS (/vi/products). Language-free by design.
#
# Compiled 2026-08-25. Sources: docs/01-proof-bank.md §D §E §F1 §F2,
# docs/02-message-map.md, docs/03-structure.md §1 §4b,
# content-system/claims/approved.yaml, GM intake 2026-08-25.
#
# `docs/` and `context/` are written ABOUT the page. They are not the page. Read them for FACTS,
# never for editorial framing. `context/` carries English sentence shape — MATERIAL, not copy.
#
# A `body` earns its place only by adding a FACT its `title` does not carry. No such fact -> leave it
# empty. Components skip empty strings by design.

id: products
type: marketing

contract:
  page:
    type: product_page
    goal: let a buyer identify the relevant product branch and move to a consultation
    funnel_stage: consideration
  audience:
    primary: Vietnamese enterprise and industrial buyers; Korean FDI firms in Vietnam
    buyer: business owner, operations leader, IT leader or procurement decision-maker
    evaluator: engineer or IT lead who checks status, method and source
    user: operations, sales, HR and document-management teams
    awareness_level: product_aware
    primary_problem: the catalogue takes too long to reveal what is available and what is planned
  product:
    name: Pebble Vina product catalogue
    category: Edge AI silicon and E-Series compute accelerators from Pebble Square plus enterprise software and enterprise AI training from Pebble Vina
    description: three chip families, two E-Series accelerator tiers, a dated enterprise-software roadmap and a separate 2027 training-needs survey
    capabilities:
      - edge inference on MINT
      - vision and security workloads on the PAPAYA family
      - large-model and data-centre workloads on the ESPRESSO roadmap
      - E10 and E20 accelerators for training and inference from Pebble Square
      - enterprise operations across CRM ERP HRM and document management on the December 2026 roadmap
      - a 2027 survey of enterprise-specific AI training needs before any programme is designed
    mechanisms:
      - PIM executes computation where data is stored
      - the enterprise suite joins operational records and lets AI propose actions for human approval
      - a later training programme would start from a company-specific problem and use agreed ROI indicators to assess output
    deployment_models: [on-device, edge, on-premise enterprise infrastructure]
    constraints:
      - PAPAYA has a customer PoC milestone; mass production and general availability are not verified
      - ESPRESSO is investor-material roadmap content and is absent from the public Pebble Square catalogue
      - the enterprise suite is roadmap content, not a product available today
      - 2027 is the enterprise-training survey milestone, not a training launch
      - E-Series ownership and specifications are confirmed, but general availability, inventory, customer and deployment are not verified
      - no GPU distribution agreement, enterprise-software platform or customer deployment is verified
      - no fixed curriculum, class date, fee, certificate, case study or training outcome is verified
  problems:
    - product families are hidden behind long explanatory copy
    - hardware and software status are hard to compare in one scan
    - a buyer needs to know which branch fits before reading specifications
    - category, maturity and next use are not visually separable in the current index
  buyer_values:
    - reach the relevant product branch from the first screen
    - see one decision-grade proof point per hardware family
    - distinguish production, PoC and roadmap before contacting sales
    - understand the software direction without mistaking it for a shipped suite
    - separate a training-needs survey from a course that is already available
  proof:
    verified: [C002, C003, C004, C018]
    contextual: [C017, C030, C036, C037, C038, C039, C040, C041, C042, C043, C044]
    held_back: [C005, C006, C007, C034]
    unavailable:
      - PAPAYA mass-production or general-availability evidence
      - any named PAPAYA customer or deployment count
      - E-Series general availability, inventory, customer or deployment count
      - any GPU distribution relationship — docs/05-backlog.md #18
      - enterprise-software platform, customer, deployment or measured business outcome — docs/05-backlog.md #17
      - training launch date, curriculum, pricing, certificate, customer, case study or measured ROI — docs/01-proof-bank.md §F2
  differentiators:
    - one catalogue spans sensor-scale PIM through E-Series AI accelerators to enterprise software and capability development
    - product status and roadmap dates are visible at the product name
    - each hardware family keeps one sourced number and its method
  objections:
    - is this shipping silicon, a customer PoC or a roadmap slide
    - are E10 and E20 generally available now
    - is the enterprise suite available now
    - does the 2027 training note mean a course is already scheduled
  cta:
    primary: book a consultation after selecting a product branch
    secondary: none
  tone:
    desired: [commercially direct, polished, concise, memorable, engineer-readable]
    avoid: [unsupported superlatives, luxury language, startup clichés, dense explanation, status ambiguity]
  claims_policy:
    allow_inference: false
    require_proof_for_numbers: true
    require_proof_for_superlatives: true
  locale:
    requested: [vi]
    deferred: [en, ko]
    note: deferred locales must be compiled from this spec, never translated from vi

decisions:
  scope:
    question: whole products page or named-key repair
    answered: whole products page, including meta and all catalogue blocks
    but: the site structure and route order do not move
    consequence: every visible products-page string is rewritten in one run
    still_open: []
  decision_map:
    question: what must the first screen do
    answered: let the reader compare six destinations by category, use and maturity without decoding a topology diagram
    but: the opener remains one viewport target and carries no technical proof grid
    consequence: replace the crossbar tree with a compact decision map grouped as hardware, software and training
    still_open: []
  hardware_scope:
    question: which product generations occupy the catalogue
    answered: MINT; PAPAYA and PAPAYA FLEX as one family; ESPRESSO; E-Series E10 and E20
    but: MOCHA remains historical PoC context and does not occupy a product block
    consequence: the tree shows three chip lines plus one Pebble Square E-Series branch
    still_open: []
  papaya_status:
    question: how to present the 2024 milestone
    answered: customer PoC, with its date visible
    but: no mass production, availability, customer identity or deployment count
    consequence: use C036 and show a distinct customer-PoC stage at every decision point
    still_open: []
  proof_density:
    question: how many figures each hardware block should foreground
    answered: show the same ordered three-row metric list for every chip family: Performance, Efficiency, Die or Chip Area
    but: source, evidence status and roadmap qualification may not be removed; E-Series uses Compute, Memory and Connectivity because it is an accelerator family rather than a chip die
    consequence: split verified values out of the source note; never parse or infer a missing metric in the component
    still_open: []
  enterprise_software:
    question: what software is being offered and when
    answered: a semi-automated AI enterprise suite planned for December 2026
    but: no shipped-product tense, customer, deployment, base platform or business result
    consequence: every mention carries roadmap and December 2026 at the point of mention
    still_open: []
  dms_expansion:
    question: what DMS means in this catalogue
    answered: Document Management System
    but: it does not license records-compliance or archival claims
    consequence: the module names document control and retrieval only
    still_open: []
  automation_boundary:
    question: what semi-automated means
    answered: AI proposes and coordinates; a person approves
    but: no autonomous-company or replacement-of-staff claim
    consequence: the suite AI module carries the human approval boundary
    still_open: []
  training_offer:
    question: whether enterprise AI training belongs to software or its own branch
    answered: a separate 2.3 enterprise AI training branch
    but: 2027 is the survey milestone only; no programme launch, fixed curriculum or outcome is promised
    consequence: use C040 and keep the survey, later custom design and agreed ROI evaluation boundary together
    still_open: []
  stage_taxonomy:
    question: how the page separates availability from evidence status
    answered: use distinct visible stages for mass production, customer PoC, integration capability, roadmap and needs research
    but: category colour never replaces the written stage label or the underlying shipped or roadmap evidence status
    consequence: every index tile and catalogue identity carries a stage label whose colour has one meaning
    still_open: []
  product_height:
    question: how much vertical space each hardware product may use
    answered: target one visible viewport at 390 by 844, 768 by 1024 and 1440 by 900
    but: content may grow for zoom, translated text or unusually short viewports; nothing is clipped or hidden to meet the target
    consequence: compact the layout, image and applications first; never insert space merely to fill a viewport
    still_open: []
  chip_dossier_box:
    question: how each chip section aligns its image, explanation, metrics and application images
    answered: one bordered box with chip image on the left, application lead and ordered metrics on the right, then a contained image rail across the bottom
    but: the rail may scroll inside the box on a narrow screen and may not bleed beyond the box edge
    consequence: use one spacing scale and three text levels; only product name, application lead and metric value receive emphasis
    still_open: []
  e_series:
    question: where E10 and E20 belong and how their source status is presented
    answered: E10 and E20 are Pebble Square E-Series accelerators directly below the three chip families
    but: the supplied material confirms ownership and specifications, not general availability, inventory, customers or deployments
    consequence: use one E-Series dossier with an image-and-metric row for each accelerator; show a neutral product-data badge rather than an availability claim
    still_open: [production image files for E10 and E20]
  software_cards:
    question: how CRM ERP HRM DMS and the AI operations centre are presented
    answered: one card per system with a large code-native SVG icon used as a quiet watermark
    but: icons add recognition only and make no capability claim
    consequence: render a two-column mobile grid and a two-to-three-column responsive grid above it
    still_open: []
  narrative_bridges:
    question: how a long catalogue keeps one reading line
    answered: every product or service block opens with one short transition from the previous decision layer
    but: transitions may not add a claim or repeat the body
    consequence: add a transition slot to hardware items, the enterprise group and the training offer
    still_open: []
  background_reset:
    question: whether the redesign also defines the final section-background system
    answered: no; remove every PRODUCTS section fill, dark tone, crossbar and alternating surface first
    but: the site header, footer, chip plinth and functional status colours keep their own surfaces
    consequence: category and stage are encoded with type, border, icon and accent on one page canvas
    still_open: [the final PRODUCTS background system after visual review]
  visual_register:
    question: how polished and catchy may the page be
    answered: use headline rhythm and hierarchy, not unsupported adjectives
    but: status strength and qualifications cannot change for impact
    consequence: short declarative lines; one decision-map signature; quiet dossier-style product blocks
    still_open: []
  final_conversion:
    question: whether the buyer leaves Products to contact or can submit on the same page
    answered: place the shared contact form under one compact PRODUCTS follow-up header
    but: do not repeat contact.intro title, lead, form title or office image on PRODUCTS; there is still one form implementation
    consequence: reuse the contact fields, validation, submit and success state beneath products.followUp
    still_open: []

presentation:
  opener:
    height: screen
    structure: headline plus six decision tiles grouped into hardware, software and training
    signature: a selection matrix encoding category, use and maturity in the same tile
    motion: a restrained arrow shift on hover and focus; disabled by prefers-reduced-motion
    mobile_constraint: two compact tile columns; all six destinations remain reachable without horizontal scrolling
  catalogue:
    order: [hardware lead, MINT, PAPAYA family, ESPRESSO, E-Series E10 and E20, software lead, enterprise suite, training lead, enterprise AI training, follow-up form]
    product_rule: one hardware product per viewport target; no fixed height, clipping or filler space
    background_rule: one page canvas; no PRODUCTS section fill or alternating band
    conversion_rule: one contact form at the end, with shared behaviour and PRODUCTS-only follow-up copy

blocks:
  - id: products.intro
    height: screen
    intent:
      communicate: the catalogue has hardware, software and training branches with different maturity stages
      reader_question: what products are here and where should I start
    claims: [C004, C036, C017, C030, C037, C040]
    qualifiers:
      - the maturity stage of every destination is visible in the decision map
      - the opener targets one viewport but never clips on small or zoomed screens
    forbidden:
      - a generic portfolio headline with no decision support
      - explanation of PIM or enterprise modules in the opener
    slots:
      kicker: page category
      title: the catalogue span, stated as a product choice
      lead: one instruction for using the decision map
      scroll_label: accessible action label for moving to the hardware section
      decision_entries: product names, one use cue and their visible stage

  - id: products.hardware
    height: content
    intent:
      communicate: three Pebble Square chip lines plus the Pebble Square E-Series accelerator family
      reader_question: which hardware path matches my workload
    claims: [C004, C036, C017, C041, C042, C043]
    slots:
      kicker: section index
      title: hardware scope in one line
      lead: status rule for reading the four entries

  - id: products.hardware.mint
    origin: ps
    status: shipped
    height: content
    intent:
      communicate: MINT is the production edge-AI part
      reader_question: which chip can I evaluate now for low-power edge workloads
    claims: [C002, C003, C004, C038]
    values:
      - place inference inside a field device power envelope
    qualifiers:
      - mass production started in May 2023; 2022 is the development-completion year
    slots:
      name: product name verbatim
      transition: move from catalogue selection to low-power processing at the device
      application_lead: name the product forms where MINT is commonly positioned, without implying deployments
      tagline: architecture, production status and workload class
      body: operational value plus the boundary of the part
      capabilities: [Smart Home, IoT, Failure Analysis]
      specs:
        - value: 17.6 TOPS/W energy efficiency
          must_carry: [30 GOPS, 5 by 5 mm die, mass production since May 2023, source]
      metrics:
        - Performance: 30 GOPS
        - Efficiency: 17.6 TOPS/W
        - Die or Chip Area: 5 by 5 mm
      media_alt: literal description of the MINT render

  - id: products.hardware.papaya
    origin: ps
    status: shipped
    status_note: customer PoC in 2024
    height: content
    intent:
      communicate: the PAPAYA family reached a customer PoC for vision and security workloads
      reader_question: how mature is the vision-AI line
    claims: [C036]
    qualifiers:
      - PoC is not mass production or general availability
      - do not name or imply a customer
      - the number belongs to PAPAYA; do not silently move it to PAPAYA FLEX
    forbidden:
      - present-tense availability
      - PAPAYA FLEX comparison multiples in the foreground
    slots:
      name: PAPAYA and PAPAYA FLEX family name
      transition: move from signals to image and vision workloads
      application_lead: name vision, image-recognition and security product forms at the customer-PoC boundary
      tagline: customer-PoC status, year and workload class
      body: what the PoC established and what it did not establish
      capabilities: [Image Recognition, Vision Recognition, Security System]
      specs:
        - value: 30 TOPS/W efficiency
          must_carry: [0.5 TOPS, 5 by 5 mm die, customer PoC in 2024, investor source]
      metrics:
        - Performance: 0.5 TOPS
        - Efficiency: 30 TOPS/W
        - Die or Chip Area: 5 by 5 mm
      media_alt: literal description of the PAPAYA family render

  - id: products.hardware.espresso
    origin: ps
    status: roadmap
    status_note: Q3 2026; investor material; absent from the public catalogue
    height: content
    intent:
      communicate: ESPRESSO is the dated Digital-PIM direction for larger workloads
      reader_question: what comes after edge inference and when
    claims: [C017, C039]
    qualifiers:
      - every mention carries roadmap, Q3 2026 and investor-material attribution
      - applications are targets, never present capabilities
    forbidden:
      - available or shipping tense
      - describing a render as production silicon
    slots:
      name: product name verbatim
      transition: move from current edge parts to the dated direction for larger models
      application_lead: name roadmap targets only, with Q3 2026 in the same sentence
      tagline: Digital-PIM branch, workload span and roadmap date
      body: direction of travel plus current unavailability
      capabilities: [AI PC, Robotics, Data Center]
      specs:
        - value: 160 TOPS at INT8
          must_carry: [16 TOPS/W, 20 by 23 mm package, 640 TOPS four-chip card, investor source, roadmap date]
      metrics:
        - Performance: 160 TOPS at INT8
        - Efficiency: 16 TOPS/W
        - Die or Chip Area: 20 by 23 mm
      media_alt: describe the ESPRESSO image as a roadmap render

  - id: products.hardware.gpu
    origin: ps
    status: shipped
    height: content
    intent:
      communicate: E-Series extends the catalogue from edge silicon to training and inference accelerators
      reader_question: which E-Series tier matches the workload scale
    claims: [C041, C042, C043, C044]
    qualifiers:
      - product data and ownership are confirmed by the GM-supplied E-Series material
      - do not imply general availability, inventory, customer or deployment count
    slots:
      name: E-Series AI Compute Accelerators
      transition: move from a dedicated edge device to server and multi-card compute
      application_lead: enterprise AI server, LLM training and inference, vision, NLP, speech and multi-card computing
      tagline: GP-DSA for training and inference
      body: one architecture from FP32 to INT4 with PCIe 5.0 and RDMA
      variants:
        - E10 PCIe:
            application_lead: balanced enterprise-server deployment
            metrics: [32 AI cores with precision figures, 48 GB memory, PCIe and RDMA connectivity]
        - E20:
            application_lead: larger models and distributed AI infrastructure
            metrics: [64 AI cores with precision figures, 96 GB memory, dual PCIe and denser RDMA connectivity]
      software_stack: [AI Compiler, Graph Optimization, Operator Generation, Performance and Precision Tools, Framework Compatibility]
      capabilities: [Enterprise AI Server, LLM Training and Inference, Computer Vision, NLP and Speech AI, Multi-card Computing]
      media_alt: one literal product-image brief per accelerator; render a visible pending state until the files exist

  - id: products.software
    height: content
    status: roadmap
    status_note: December 2026
    intent:
      communicate: one Pebble Vina enterprise suite is planned above the hardware catalogue
      reader_question: what software layer is coming and when
    claims: [C037]
    qualifiers:
      - roadmap date appears in the band and product block
    slots:
      kicker: section index
      title: enterprise software category and roadmap status
      lead: scope of the suite in one line

  - id: products.software.enterprise
    origin: pv
    status: roadmap
    status_note: December 2026
    height: content
    intent:
      communicate: one operating view joins core records and AI-assisted next actions
      reader_question: what will the suite monitor and what remains under human control
    claims: [C037]
    mechanisms:
      - CRM ERP HRM and DMS feed one operations view
      - AI proposes and coordinates; a person approves
    qualifiers:
      - roadmap December 2026 at every mention
      - DMS means Document Management System
      - no customer, deployment, platform, full autonomy or result claim
    slots:
      name: product category
      transition: move from processing data to using its result in enterprise operations
      tagline: roadmap date plus the human-approval boundary
      body: how the four systems and operations view connect
      modules:
        - CRM: customer records and sales activity
        - ERP: orders inventory purchasing and operations
        - HRM: workforce records and work allocation
        - DMS: document control and retrieval
        - AI operations centre: cross-module monitoring and proposed next actions for human approval
      media_alt: literal brief for the enterprise-suite interface; image remains pending

  - id: products.training
    height: content
    status: roadmap
    status_note: needs survey in 2027
    intent:
      communicate: enterprise AI training is a separate research-stage service direction
      reader_question: is there a standard course I can buy now
    claims: [C040]
    qualifiers:
      - 2027 is a needs-survey milestone, not a training launch
      - no fixed curriculum, class date, fee, certificate or result exists
    slots:
      kicker: section index 2.3
      title: enterprise AI training category
      lead: survey-first boundary in one line

  - id: products.training.enterprise
    origin: pv
    status: roadmap
    status_note: needs survey in 2027
    height: content
    intent:
      communicate: any later programme would be shaped around a specific enterprise problem and assessed against agreed output indicators
      reader_question: what would make this different from a fixed theory course
    claims: [C040]
    mechanisms:
      - survey the enterprise problem and capability gap first
      - design practice around that context instead of a fixed syllabus
      - agree ROI indicators before delivery and use them to assess output
    qualifiers:
      - assessment does not guarantee positive ROI or a numeric return
      - delivery timing remains undecided after the 2027 survey
    slots:
      name: service direction
      transition: move from systems to the people who must use them on a measurable task
      tagline: visible 2027 survey stage and custom-design boundary
      body: distinguish the planned survey from a course already available
      principles:
        - survey the enterprise problem before programme design
        - design for a company-specific use case, not a fixed curriculum
        - use applied work rather than theory-only delivery
        - assess output using ROI indicators agreed before delivery without promising the result

  - id: products.contact
    height: content
    intent:
      communicate: submit the selected product need without leaving the catalogue
      reader_question: how do I start the consultation now
    qualifiers:
      - reuse the contact form fields and behaviour; do not create a second form implementation
      - do not render contact.intro, contact.form.title or contact.media on PRODUCTS
      - preserve validation, mail-client handoff, success state and contact fallback
    slots:
      follow_up_kicker: one step label connecting selection to consultation
      follow_up_title: acknowledge that the reader has selected a branch and state the next action
      form: reuse contact.form and contact.ctaPrimary

chrome:
  meta:
    products:
      title: identify the product catalogue and the company
      description: name the three chip lines, GPU and HPC integration, the December 2026 enterprise suite and the 2027 training-needs survey
  index_navigation:
    rule: names, use cues and stages are generated from hardware items, software groups and the training offer; no duplicate content source
  mobile_navigation:
    training_label: short label for the separate 2.3 branch

locale_scope:
  writing: [vi]
  deferred: [en, ko]

artifact:
  id: products
  path: content-system/output/products.vi.json
  apply_to: web/content/vi.ts
