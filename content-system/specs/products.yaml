# Semantic spec — PRODUCTS (/vi/products). Language-free by design.
#
# Compiled 2026-08-25. Sources: docs/01-proof-bank.md §D §E §F1 §F2,
# docs/02-message-map.md, docs/03-structure.md §1 §4b,
# content-system/claims/approved.yaml, GM intake 2026-08-25.
#
# REPAIR 2026-09-03 (decisions/*_2026_09_03). The page was rebuilt on the Canva master
# "Product - Pebble Vina" (1536x1024, 7 artboards, read 2026-09-02): every block is now
# dark band -> white specification island -> application row -> one CTA. That anatomy opened
# nine content slots and closed eight. Named-key repair only — no block below is recompiled.
# Artifact: content-system/output/products.canva-master.vi.json.
#
# `docs/` and `context/` are written ABOUT the page. They are not the page. Read them for FACTS,
# never for editorial framing. `context/` carries English sentence shape — MATERIAL, not copy.
#
# A `body` earns its place only by adding a FACT its `title` does not carry. No such fact -> leave it
# empty. Components skip empty strings by design.

id: products
type: marketing

contract:
  page:
    type: product_page
    goal: let a buyer identify the relevant product branch and move to a consultation
    funnel_stage: consideration
  audience:
    primary: Vietnamese enterprise and industrial buyers; Korean FDI firms in Vietnam
    buyer: business owner, operations leader, IT leader or procurement decision-maker
    evaluator: engineer or IT lead who checks status, method and source
    user: operations, sales, HR and document-management teams
    awareness_level: product_aware
    primary_problem: the catalogue takes too long to reveal what is available and what is planned
  product:
    name: Pebble Vina product catalogue
    category: Edge AI silicon and E-Series compute accelerators from Pebble Square plus enterprise software and enterprise AI training from Pebble Vina
    description: three chip families, two E-Series accelerator tiers, a dated enterprise-software roadmap and a separate 2027 training-needs survey
    capabilities:
      - edge inference on MINT
      - vision and security workloads on the PAPAYA family
      - large-model and data-centre workloads on the ESPRESSO roadmap
      - E10 and E20 accelerators for training and inference from Pebble Square
      - enterprise operations across CRM ERP HRM and document management on the December 2026 roadmap
      - a 2027 survey of enterprise-specific AI training needs before any programme is designed
    mechanisms:
      - PIM executes computation where data is stored
      - the enterprise suite joins operational records and lets AI propose actions for human approval
      - a later training programme would start from a company-specific problem and use agreed ROI indicators to assess output
    deployment_models: [on-device, edge, on-premise enterprise infrastructure]
    constraints:
      - PAPAYA has a customer PoC milestone; mass production and general availability are not verified
      - ESPRESSO is investor-material roadmap content and is absent from the public Pebble Square catalogue
      - the enterprise suite is roadmap content, not a product available today
      - 2027 is the enterprise-training survey milestone, not a training launch
      - E-Series ownership and specifications are confirmed, but general availability, inventory, customer and deployment are not verified
      - no GPU distribution agreement, enterprise-software platform or customer deployment is verified
      - no fixed curriculum, class date, fee, certificate, case study or training outcome is verified
  problems:
    - product families are hidden behind long explanatory copy
    - hardware and software status are hard to compare in one scan
    - a buyer needs to know which branch fits before reading specifications
    - category, maturity and next use are not visually separable in the current index
  buyer_values:
    - reach the relevant product branch from the first screen
    - see one decision-grade proof point per hardware family
    - distinguish production, PoC and roadmap before contacting sales
    - understand the software direction without mistaking it for a shipped suite
    - separate a training-needs survey from a course that is already available
  proof:
    verified: [C002, C003, C004, C018]
    contextual: [C017, C030, C036, C037, C038, C039, C040, C041, C042, C043, C044]
    held_back: [C005, C006, C007, C034]
    unavailable:
      - PAPAYA mass-production or general-availability evidence
      - any named PAPAYA customer or deployment count
      - E-Series general availability, inventory, customer or deployment count
      - any GPU distribution relationship — docs/05-backlog.md #18
      - enterprise-software platform, customer, deployment or measured business outcome — docs/05-backlog.md #17
      - training launch date, curriculum, pricing, certificate, customer, case study or measured ROI — docs/01-proof-bank.md §F2
  differentiators:
    - one catalogue spans sensor-scale PIM through E-Series AI accelerators to enterprise software and capability development
    - product status and roadmap dates are visible at the product name
    - each hardware family keeps one sourced number and its method
  objections:
    - is this shipping silicon, a customer PoC or a roadmap slide
    - are E10 and E20 generally available now
    - is the enterprise suite available now
    - does the 2027 training note mean a course is already scheduled
  cta:
    primary: book a consultation after selecting a product branch
    secondary: none
  tone:
    desired: [commercially direct, polished, concise, memorable, engineer-readable]
    avoid: [unsupported superlatives, luxury language, startup clichés, dense explanation, status ambiguity]
  claims_policy:
    allow_inference: false
    require_proof_for_numbers: true
    require_proof_for_superlatives: true
  locale:
    requested: [vi]
    deferred: [en, ko]
    note: deferred locales must be compiled from this spec, never translated from vi

decisions:
  scope:
    question: whole products page or named-key repair
    answered: whole products page, including meta and all catalogue blocks
    but: the site structure and route order do not move
    consequence: every visible products-page string is rewritten in one run
    still_open: []
  decision_map:
    question: what must the first screen do
    answered: let the reader compare six destinations by category, use and maturity without decoding a topology diagram
    but: the opener remains one viewport target and carries no technical proof grid
    consequence: replace the crossbar tree with a compact decision map grouped as hardware, software and training
    still_open: []
  hardware_scope:
    question: which product generations occupy the catalogue
    answered: MINT; PAPAYA and PAPAYA FLEX as one family; ESPRESSO; E-Series E10 and E20
    but: MOCHA remains historical PoC context and does not occupy a product block
    consequence: the tree shows three chip lines plus one Pebble Square E-Series branch
    still_open: []
  papaya_status:
    question: how to present the 2024 milestone
    answered: customer PoC, with its date visible
    but: no mass production, availability, customer identity or deployment count
    consequence: use C036 and show a distinct customer-PoC stage at every decision point
    still_open: []
  proof_density:
    question: how many figures each hardware block should foreground
    answered: "show the same ordered three-row metric list for every chip family: Performance, Efficiency, Die or Chip Area"
    but: source, evidence status and roadmap qualification may not be removed; E-Series uses Compute, Memory and Connectivity because it is an accelerator family rather than a chip die
    consequence: split verified values out of the source note; never parse or infer a missing metric in the component
    still_open: []
  enterprise_software:
    question: what software is being offered and when
    answered: a semi-automated AI enterprise suite planned for December 2026
    but: no shipped-product tense, customer, deployment, base platform or business result
    consequence: every mention carries roadmap and December 2026 at the point of mention
    still_open: []
  dms_expansion:
    question: what DMS means in this catalogue
    answered: Document Management System
    but: it does not license records-compliance or archival claims
    consequence: the module names document control and retrieval only
    still_open: []
  automation_boundary:
    question: what semi-automated means
    answered: AI proposes and coordinates; a person approves
    but: no autonomous-company or replacement-of-staff claim
    consequence: the suite AI module carries the human approval boundary
    still_open: []
  training_offer:
    question: whether enterprise AI training belongs to software or its own branch
    answered: a separate 2.3 enterprise AI training branch
    but: 2027 is the survey milestone only; no programme launch, fixed curriculum or outcome is promised
    consequence: use C040 and keep the survey, later custom design and agreed ROI evaluation boundary together
    still_open: []
  stage_taxonomy:
    question: how the page separates availability from evidence status
    answered: use distinct visible stages for mass production, customer PoC, integration capability, roadmap and needs research
    but: category colour never replaces the written stage label or the underlying shipped or roadmap evidence status
    consequence: every index tile and catalogue identity carries a stage label whose colour has one meaning
    still_open: []
  product_height:
    question: how much vertical space each hardware product may use
    answered: target one visible viewport at 390 by 844, 768 by 1024 and 1440 by 900
    but: content may grow for zoom, translated text or unusually short viewports; nothing is clipped or hidden to meet the target
    consequence: compact the layout, image and applications first; never insert space merely to fill a viewport
    still_open: []
  chip_dossier_box:
    question: how each chip section aligns its image, explanation, metrics and application images
    answered: one bordered box with chip image on the left, application lead and ordered metrics on the right, then a contained image rail across the bottom
    but: the rail may scroll inside the box on a narrow screen and may not bleed beyond the box edge
    consequence: use one spacing scale and three text levels; only product name, application lead and metric value receive emphasis
    still_open: []
  e_series:
    question: where E10 and E20 belong and how their source status is presented
    answered: E10 and E20 are Pebble Square E-Series accelerators directly below the three chip families
    but: the supplied material confirms ownership and specifications, not general availability, inventory, customers or deployments
    consequence: use one E-Series dossier with an image-and-metric row for each accelerator; show a neutral product-data badge rather than an availability claim
    still_open: [production image files for E10 and E20]
  software_cards:
    question: how CRM ERP HRM DMS and the AI operations centre are presented
    answered: one card per system with a large code-native SVG icon used as a quiet watermark
    but: icons add recognition only and make no capability claim
    consequence: render a two-column mobile grid and a two-to-three-column responsive grid above it
    still_open: []
  narrative_bridges:
    question: how a long catalogue keeps one reading line
    answered: every product or service block opens with one short transition from the previous decision layer
    but: transitions may not add a claim or repeat the body
    consequence: add a transition slot to hardware items, the enterprise group and the training offer
    still_open: []
    superseded_by: narrative_bridges_retired_2026_09_03
  background_reset:
    question: whether the redesign also defines the final section-background system
    answered: no; remove every PRODUCTS section fill, dark tone, crossbar and alternating surface first
    but: the site header, footer, chip plinth and functional status colours keep their own surfaces
    consequence: category and stage are encoded with type, border, icon and accent on one page canvas
    still_open: [the final PRODUCTS background system after visual review]
  visual_register:
    question: how polished and catchy may the page be
    answered: use headline rhythm and hierarchy, not unsupported adjectives
    but: status strength and qualifications cannot change for impact
    consequence: short declarative lines; one decision-map signature; quiet dossier-style product blocks
    still_open: []
  final_conversion:
    question: whether the buyer leaves Products to contact or can submit on the same page
    answered: place the shared contact form under one compact PRODUCTS follow-up header
    but: do not repeat contact.intro title, lead, form title or office image on PRODUCTS; there is still one form implementation
    consequence: reuse the contact fields, validation, submit and success state beneath products.followUp
    still_open: []
    superseded_by: block_cta_2026_09_03

  # ── Repair 2026-09-03 — the Canva master "Product - Pebble Vina" ────────────
  canva_master_repair_2026_09_03:
    question: which keys move now that the page anatomy follows the Canva master
    answered: >-
      nine slots are filled (catalogue heading and lead, two index band labels, six long-form
      block headlines, one training callout, one roadmap date note, one block CTA), three
      ESPRESSO application titles are repaired, and eight slots are retired
    but: >-
      no block below is recompiled. Every body, tagline, metric, source line and status note
      keeps the wording approved on 2026-08-25 and on the 2026-08-24 PAPAYA repair
    consequence: >-
      write only the keys named in this repair. A block that reads badly next to a new headline
      is a finding for the next round, not a licence to rewrite it in this one.
    still_open: []

  canva_fidelity_2026_09_03:
    question: how closely the Vietnamese follows the strings drawn in the Canva master
    answered: the master is the wording source; spelling, casing and terminology are corrected to repo law
    but: >-
      the master is a design file, not a proof source. Four of its strings are wrong and do not
      ship: "NVIDIA Jetson Nano" on the PAPAYA base-station row (proof bank §E2 says NVIDIA L4),
      "INTB" for INT8, "82% Hoàn thành mục tiêu" on the software artboard (no proof-bank entry),
      and "phần cứng và phần mềm của Pebble Square" in the catalogue lead (the software and the
      training are Pebble Vina's — proof bank §F1 §F2)
    consequence: >-
      store headings in sentence case because the components apply their own uppercase; use the
      published proper nouns (Analog-PIM, Digital-PIM, Edge AI) where the master typed them loosely;
      correct a Canva string whenever the proof bank contradicts it and record the correction here.
    still_open: []

  catalogue_index_head_2026_09_03:
    question: what the catalogue strip under the hero says before the reader picks a card
    answered: one heading naming the two halves of the catalogue, one lead naming who builds which half
    but: >-
      the lead may not attribute the enterprise software or the AI training to Pebble Square, and it
      may not describe any branch as available — maturity is carried per card by indexStageLabel
    consequence: >-
      the lead names Pebble Square for hardware and Pebble Vina for software and training, and
      nothing else. It is navigation, not a capability sentence.
    still_open: []

  catalogue_band_labels_2026_09_03:
    question: what the two hardware bands of the index are called
    answered: the master's own labels — an NPU chip band and a GP-GPU band
    but: >-
      "GP-GPU" is the master's market-category word for the accelerator band; the architecture on
      record is GP-DSA (C041, proof bank §E5) and it stays GP-DSA everywhere it is stated as a fact
    conflict: >-
      Canva says GP-GPU, the proof bank says GP-DSA. The band label is a signpost, not an
      architecture statement, so no claim is cited on it; the E-Series tagline, technology label and
      body continue to say GP-DSA. If the GM wants one word on the page, this label is the one to
      change — it costs a string, not a claim.
    consequence: the band label cites no claim and never appears inside a sentence about the architecture
    still_open: []
    superseded_by: catalogue_band_gpu_relabel_2026_09_03

  catalogue_band_gpu_relabel_2026_09_03:
    question: >-
      does the index band keep the master's "GP-GPU Solution" now that the block beneath it
      states GP-DSA four times — the still_open left by catalogue_band_labels_2026_09_03
    answered: >-
      no. The band is relabelled to name what the products are — AI accelerator cards — with no
      architecture acronym in it at all
    but: >-
      this is a signpost decision, not a claim change. No claim is gained or lost: the band cited
      none before and cites none now. GP-DSA remains the architecture word in every slot that
      states it as a fact — tagline, technologyLabel, body, AI Compiler supporting item
    consequence: >-
      the two hardware bands separate by FORM, which is the distinction the index exists to draw
      (spec slot: "so they do not read as a fourth chip"): chip line versus accelerator card.
      No band label may carry an architecture acronym again — a signpost that names an
      architecture is read as an architecture statement by the one reader who checks, and this
      one contradicted the spec panel directly below it. The label is also the `aria-label` of
      its `<section>` in catalog-index.tsx, so it is navigation text and must stay short.
    ceiling: >-
      the gpu band occupies one of six columns at lg (about 180px) at font-mono 0.7rem uppercase
      with 0.14em tracking. Keep it at or under the NPU band's length or it wraps to two lines.
    still_open: []

  block_headlines_2026_09_03:
    question: what the new long-form headline slot carries above each family
    answered: product name, then one clause naming what it is and the workload it is for
    but: >-
      a headline is a noun phrase, never a tense. It may not say a roadmap part does anything today,
      and it does not replace the status badge that sits four elements below it in the same band
    consequence: >-
      the roadmap families (ESPRESSO, the enterprise suite, the training offer) keep the date in the
      tagline and the badge directly under the headline, so the label is present at the point of
      mention without printing the date twice in adjacent lines. If a component ever renders one of
      these headlines away from its badge — an index, a card, a share image — the date must travel
      with it.
    still_open: []

  espresso_date_note_2026_09_03:
    question: where the Q3/2026 label lives on the three ESPRESSO application cards
    answered: in its own dateNote field under the card title
    but: the date is not optional decoration — CLAUDE.md §2 rule 4 requires it on every ESPRESSO mention
    consequence: >-
      strip "· dự kiến Q3/2026" from the three capability titles so the date prints once, and fill
      dateNote on all three cards with the same string. A card that loses its dateNote loses the
      label, so the two edits are one change and never ship apart.
    still_open: []

  block_cta_2026_09_03:
    question: how the page converts now that the embedded contact form is gone
    answered: one button per hardware, software and training block, all pointing at /vi/contact
    but: >-
      the button is a products-page string, not the site-wide header CTA. It borrows nav.cta
      ("Liên hệ ngay") only until its own key exists
    consequence: >-
      the label is compiled as products.ctaLabel. It cannot be applied to web/content/vi.ts until
      ProductsContent declares the field — vi.ts is typed, and an undeclared key fails the build.
      The string is validated and waiting; wiring is a web-ui-engineer follow-up (types.ts field
      plus the three BlockCta call sites in hardware-block, software-block, training-block).
    still_open: []
    resolved: >-
      2026-09-03. ProductsContent.ctaLabel exists (types.ts:337) and all three BlockCta call sites
      read it with `fallbackLabel={c.nav.cta}`. The approved string was applied from
      content-system/output/products.canva-master.vi.json unchanged — an apply, not a recompile.
      The three blocks no longer fall back to the header label.

  # ── Repair 2026-09-03b — findings routed back by web-ui-engineer ───────────
  training_kicker_2026_09_03:
    question: >-
      the training kicker restates its own block headline word for word — measured at every
      viewport from 360 to 1920px, one line apart, in the same visual weight
    answered: >-
      the kicker drops to the bare category noun, matching the terser pattern its two siblings
      already use. It is a section index, not a second headline
    but: >-
      the kicker was the artifact's carrier of the 2027 survey stage
      ("03 · Đào tạo AI doanh nghiệp · khảo sát 2027"). Shortening it may not remove that
      qualification from the page
    consequence: >-
      the 2027 survey boundary is carried four times inside the same band, all below the kicker:
      training.lead, offer.tagline, offer.calloutNote and the StatusBadge on offer.statusNote —
      plus indexStageLabel on the catalogue card. The kicker therefore carries no claim and no
      status label, and the entry drops C040 for the same reason a signpost cites nothing.
      If a future round strips any of those four carriers, this kicker has to take the year back.
    ceiling: >-
      a section kicker on this page is a bare category noun with its index number. It may not
      repeat any word sequence from the headline that follows it.
    still_open: []

  espresso_capability_alts_2026_09_03:
    question: >-
      the three ESPRESSO application cards ship with empty `alt`; every MINT and PAPAYA
      application card has a literal one. What may an ESPRESSO application alt say
    answered: >-
      literal visual description of what is depicted, and nothing else — the same three-clause
      shape the ten sibling alts already use: object, then two physical details
    but: >-
      the three images are generic machine-class renders, not ESPRESSO hardware. An alt may not
      name ESPRESSO, may not say a machine runs it, and may not describe any of them as built,
      shipping or deployed. Describing the picture is what PREVENTS the implication — an alt
      reading "máy tính AI chạy chip ESPRESSO" would break CLAUDE.md §2 rule 4 in three places
      at once
    consequence: >-
      the alts state no claim, cite no claim id and carry no status label, because they assert
      nothing about the product. The roadmap boundary belongs to the card's own three elements —
      title, dateNote (`Dự kiến Q3/2026`) and body ("Mục tiêu cho …") — which a screen reader
      reads in that order immediately after the image.
    verified: >-
      written against the actual pixels, not the filenames: the three .webp files were opened and
      viewed on 2026-09-03. All ten application images are transparent-background renders, so no
      alt on this rail states a background colour.
    still_open: []

  e_series_catalogue_alt_2026_09_03:
    question: >-
      the E-Series catalogue card reuses the E10 image file, so its alt describes an E10 while
      the card is labelled "E-Series · E10 / E20". Family-level alt, or literal
    answered: literal. The alt describes the image, and the image is one E10 card
    but: >-
      the compiled value in content-system/output/products.vi.json was family-level
      ("Dòng card tăng tốc AI E-Series của Pebble Square.") and the page has been shipping a
      literal string instead. The ledger and the page disagreed; this decision makes the ledger
      follow the page rather than the reverse
    consequence: >-
      a family-level alt would describe something not depicted — the accessibility failure of
      telling a non-sighted reader what a sighted one cannot see, while withholding what they
      can. The family framing already arrives inside the same `<a>`: the card's visible name
      "E-Series · E10 / E20" follows the image in the accessible name. Two identical alts for the
      same image file used twice on one page is correct behaviour, not a duplicate defect, and
      the two must not be made to differ.
    verified: >-
      /media/chips/e10.webp opened and viewed 2026-09-03 — full-height PCIe card, brushed silver
      aluminium shroud, black vented bracket, gold PCIe edge connector. The shipped string is
      accurate against the pixels.
    still_open: []

  narrative_bridges_retired_2026_09_03:
    question: do the bridge sentences between families survive the new anatomy
    answered: no — the master has no slot between two blocks, and no component reads `transition`
    but: the reading line is now carried by the band order and the index, not by a sentence
    consequence: >-
      all six transition slots leave the page contract: four hardware items, the enterprise group,
      the training offer. The strings are emptied in vi.ts and their entries are removed from
      content-system/output/products.vi.json.
    still_open: [removing the `transition` fields from web/content/types.ts — web-ui-engineer]

  final_conversion_retired_2026_09_03:
    question: does the page still end on an embedded contact form
    answered: no — the page closes on the training block's own button; the full form lives on /vi/contact
    but: nothing about the contact page changes, and the form implementation is still the single one
    consequence: >-
      products.followUp.kicker and products.followUp.title leave the page contract, emptied in vi.ts
      and removed from the artifact. The products.contact block below keeps only its record of why.
    still_open: [removing the `followUp` object from web/content/types.ts — web-ui-engineer]

  # ── ship-page round 2, GM answering live in the main session, 2026-09-03 ───

