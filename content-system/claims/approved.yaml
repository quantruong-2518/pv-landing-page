# Never usable. Present so a writer reaching for one finds the refusal instead of an empty ledger.
forbidden:

  F001:
    statement: Pebble Square performs arc-fault or solar-PV detection
    reason: "Not among their six published business sectors. Arc-fault is Pebble Vina's own application layer."
    detect:
      - "Pebble Square.{0,90}(arc[- ]?fault|hồ quang|아크 결함|solar[- ]?pv|điện mặt trời)"
      - "(arc[- ]?fault|hồ quang|아크 결함|solar[- ]?pv|điện mặt trời).{0,90}Pebble Square"
    note: Arc-fault is Pebble Vina's own application layer and may be written about freely. Only attributing it to Pebble Square is forbidden.
    source: docs/01-proof-bank.md §H2

  F002:
    statement: "MDPI Electronics 2024 — Electrical Anomaly Detection Based on PIM Chip"
    reason: The paper does not exist. Verified 2026-06-14.
    detect: ["MDPI", "Electrical Anomaly Detection Based on PIM"]
    source: docs/01-proof-bank.md §H1

  F003:
    statement: Benchmark comparing MINT against ST or TI parts
    reason: No such public benchmark. The only valid benchmark set is §E2.
    detect: ["MINT vs ST", "MINT vs TI", "so với ST", "STMicro"]
    source: docs/01-proof-bank.md §H3

  F004:
    statement: ESPRESSO is available now
    reason: Roadmap, September 2026, investor material only.
    detect: ["ESPRESSO is available now", "ESPRESSO available today", "ESPRESSO đã có", "ESPRESSO 출시"]
    source: docs/01-proof-bank.md §E3

  F005:
    statement: Pebble Vina is a wholly-owned subsidiary of Pebble Square
    reason: Ownership structure unverified — internal.
    detect: ["wholly[- ]owned", "công ty con 100", "100% subsidiary", "완전 자회사"]
    source: docs/01-proof-bank.md §G

  F006:
    statement: Pebble Square won the 10th KGCCI Innovation Awards
    reason: Their News page mentions it with a truncated headline; won vs mentioned is unverified.
    detect: ["won the .{0,20}KGCCI", "đoạt giải KGCCI", "KGCCI .{0,20}수상"]
    source: docs/01-proof-bank.md §G

  F007:
    statement: Any customer name, partner logo, case-study count, ROI figure or revenue number
    reason: None are verified. Log the gap in docs/05-backlog.md instead.
    detect: ["trusted by leading", "ROI of", "cost reduction of", "tiết kiệm \\d+% chi phí"]
    source: docs/01-proof-bank.md §H4

policy:
  allow_inference: false
  require_proof_for_numbers: true
  require_proof_for_superlatives: true
  # Numbers that never need a ledger entry: years in a date, list ordinals, phone and tax numbers
  # already in facts/company.yaml.
  ignore_number_contexts: [tax_id, phone, address, postal_code]
