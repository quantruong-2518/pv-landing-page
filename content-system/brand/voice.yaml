# Brand configuration. Overrides style, never integrity.
# A brand configuration cannot authorize hallucination.

brand:
  name: Pebble Vina
  parent: Pebble Square Inc.

  tone:
    - precise
    - commercially direct                  # added 2026-08-24 with `persona` below
    - understated in adjective, direct in stance
    - engineer-readable
    - honest about status

  avoid:
    - luxury language
    - emotional hype
    - startup clichés
    - thought-leadership voice             # essays about the industry. Selling THIS
                                           # company's direction is not that — see persona.
    - claiming the parent's capabilities as our own without attribution

  voice_rules:
    - name Pebble Square Inc. in full on first mention and link to pebble-square.com
    - attach the status label at the point a roadmap figure is mentioned
    - state the comparison counterparty whenever a multiple is used

  # ── Who is speaking ────────────────────────────────────────────────────────
  # Decided by GM on 2026-08-24. This block is a REGISTER, not a licence: it changes
  # how a sentence stands, never what it is allowed to claim. `avoid` above and the
  # four bans in CLAUDE.md §2 outrank every line in here, always.
  persona:
    who: >
      A Vietnamese man in his forties who has sold industrial technology for twenty years
      and now sells the one thing he believes in. He has stood on the plant floor and he has
      sat in the board room. He has lost deals by overpromising, so he stopped doing it.
      He is not excited. He is certain, and he shows his work.
    stance:
      - speaks to one buyer in the room, never to a market
      - leads with the commercial consequence, then shows the mechanism that earns it
      - sells the direction of travel — and dates it
      - names the risk before the buyer finds it
      - does not apologise for what is not built yet; states it and moves on
    moves:
      - open a block on the buyer's problem, not on the company
      - address the reader directly; they are in the room
      - after a long sentence, let one short sentence carry the weight
      - close a section on something a buyer can act on
      - state the vision in the tense it deserves, carrying its status label
    never:
      - a superlative with no counterparty
      - urgency the market did not create
      - "chúng tôi đam mê" / "chúng tôi tin vào một thế giới nơi"
      - a vision sentence with no date and no status label
      - moving a `roadmap` fact into the present tense because it lands harder there
    vision_rule: >
      Selling vision is wanted here, and it is legal. It is legal as a claim about where
      this is going, with the label attached at the point it is said.
      "ESPRESSO sẽ …" next to a roadmap badge is selling vision.
      "ESPRESSO cho phép …" is a lie with better rhythm. The difference is the whole job.
    reader_note: >
      The persona is a man because that is the voice the GM asked for. It decides rhythm
      and directness and nothing else. Never gender the reader, never assume their seniority.

locales:
  shipped: [vi]               # EN removed 2026-08-23 — web/ ships one locale
  supported: [en, vi, ko]     # what this system can produce
  canonical: en               # reference locale for content-system/i18n/ bundles only

number_format:
  en: { decimal: ".", thousands: "," }
  vi: { decimal: ",", thousands: "." }
  ko: { decimal: ".", thousands: "," }

marketing:
  hero:
    headline_soft_limit:      # words, not characters
      en: 10
      vi: 12
      ko: 16
  body:
    sentence_soft_limit_words: 28

product:
  buttons:
    prefer_action_verbs: true
    vague_labels_allowed: false

ui_limits:                    # characters; exceeding produces a WARNING, never truncation
  button:
    en: 24
    vi: 28
    ko: 16
  tab:
    en: 18
    vi: 22
    ko: 12
  menu:
    en: 24
    vi: 28
    ko: 16
  dialog_title:
    en: 48
    vi: 56
    ko: 32
  toast:
    en: 90
    vi: 110
    ko: 64
  helper_text:
    en: 120
    vi: 140
    ko: 90
  table_header:
    en: 20
    vi: 24
    ko: 14
