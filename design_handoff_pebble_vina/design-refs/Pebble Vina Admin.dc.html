<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  body { margin: 0; background: #05070F; color: #E8EDF7; font-family: "Be Vietnam Pro", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #4E92FF; text-decoration: none; }
  a:hover { color: #8FBAFF; }
  h1, h2 { font-family: "Chakra Petch", "Be Vietnam Pro", system-ui, sans-serif; font-weight: 700; }
  *, *::before, *::after { box-sizing: border-box; }
  input, textarea, button, select { font-family: inherit; }
  input::placeholder, textarea::placeholder { color: #5C6980; }
  ::selection { background: rgba(78,146,255,0.35); }
  :focus-visible { outline: 2px solid #4E92FF; outline-offset: 2px; }
</style>
</helmet>
<div style="min-height:100vh; background:#05070F; color:#E8EDF7; display:flex; flex-direction:column">

  <header style="position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:20px; padding:0 24px; min-height:72px; background:rgba(5,7,15,0.9); backdrop-filter:blur(14px); border-bottom:1px solid rgba(232,237,247,0.14)">
    <div style="display:flex; align-items:center; gap:12px">
      <img src="assets/logo.png" alt="" style="width:28px; height:28px; display:block" />
      <span style="font-family:'Chakra Petch'; font-weight:700; font-size:14px; letter-spacing:0.1em">PEBBLE VINA</span>
      <span style="white-space:nowrap; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; color:#7C8AA3">CMS</span>
    </div>

    <div style="display:flex; margin-left:8px; border:1px solid rgba(232,237,247,0.2)">
      <sc-for list="{{ pages }}" as="pg" hint-placeholder-count="2">
        <button type="button" onClick="{{ pg.onPick }}" style="white-space:nowrap; font-size:13px; font-weight:500; padding:10px 18px; border:0; cursor:pointer; background:{{ pg.bg }}; color:{{ pg.fg }}">{{ pg.label }}</button>
      </sc-for>
    </div>

    <div style="margin-left:auto; display:flex; flex-wrap:wrap; align-items:center; gap:14px">
      <span style="white-space:nowrap; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; color:#7C8AA3">{{ statusText }}</span>
      <a href="Pebble Vina Home.dc.html" style="white-space:nowrap; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.12em">XEM TRANG →</a>
      <button type="button" onClick="{{ onReset }}" style="white-space:nowrap; font-size:13px; font-weight:500; color:#E8EDF7; background:transparent; border:1px solid rgba(232,237,247,0.28); padding:10px 18px; cursor:pointer" style-hover="border-color:#4E92FF; color:#4E92FF">Hoàn tác</button>
      <button type="button" onClick="{{ onSave }}" style="white-space:nowrap; font-size:13px; font-weight:600; color:#05070F; background:#4E92FF; border:0; padding:11px 22px; cursor:pointer" style-hover="background:#8FBAFF">Lưu thay đổi</button>
    </div>
  </header>

  <div style="flex:1; display:grid; grid-template-columns:264px minmax(0,1fr); align-items:stretch">

    <aside style="border-right:1px solid rgba(232,237,247,0.14); background:#080D1B; padding:20px 0">
      <div style="padding:0 20px 14px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.13em; color:#7C8AA3">CÁC SECTION</div>
      <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="7">
        <button type="button" onClick="{{ sec.onPick }}" style="width:100%; display:flex; align-items:center; gap:12px; text-align:left; font-size:14px; font-weight:500; padding:13px 20px; border:0; border-left:2px solid {{ sec.mark }}; cursor:pointer; background:{{ sec.bg }}; color:{{ sec.fg }}" style-hover="background:rgba(78,146,255,0.09)">
          <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#4E92FF">{{ sec.num }}</span>
          <span style="flex:1; min-width:0">{{ sec.label }}</span>
          <span style="width:7px; height:7px; background:{{ sec.dot }}"></span>
        </button>
      </sc-for>
      <div style="margin-top:20px; padding:16px 20px 0; border-top:1px solid rgba(232,237,247,0.14); font-size:12.5px; line-height:1.7; color:#7C8AA3">Ô vuông sáng = section đang bật. Nội dung lưu trên máy bạn, chưa nối API.</div>
    </aside>

    <main style="padding:28px 28px 64px; min-width:0">
      <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; padding-bottom:18px; border-bottom:1px solid rgba(232,237,247,0.22)">
        <div style="display:flex; flex-direction:column; gap:8px">
          <span style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.13em; color:#4E92FF">{{ activeKicker }}</span>
          <h2 style="margin:0; font-size:26px; line-height:1.25; letter-spacing:0">{{ activeLabel }}</h2>
        </div>
        <label style="display:flex; align-items:center; gap:12px; cursor:pointer">
          <span style="font-size:13.5px; color:#A8B6CF">Hiển thị section này</span>
          <input type="checkbox" checked="{{ activeVisible }}" onChange="{{ onToggleVisible }}" style="width:18px; height:18px; accent-color:#4E92FF; cursor:pointer" />
        </label>
      </div>

      <sc-for list="{{ fields }}" as="fld" hint-placeholder-count="5">
        <div style="padding:22px 0; border-bottom:1px solid rgba(232,237,247,0.1); display:grid; grid-template-columns:minmax(0,200px) minmax(0,1fr); gap:24px; align-items:start">
          <div style="display:flex; flex-direction:column; gap:6px">
            <span style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; color:#A8B6CF">{{ fld.label }}</span>
            <span style="font-size:12px; line-height:1.6; color:#7C8AA3">{{ fld.hint }}</span>
          </div>

          <div style="display:flex; flex-direction:column; gap:12px; min-width:0">
            <sc-if value="{{ fld.isText }}" hint-placeholder-val="{{ true }}">
              <input type="text" value="{{ fld.value }}" onChange="{{ fld.onInput }}" placeholder="{{ fld.placeholder }}" style="width:100%; font-size:15px; color:#E8EDF7; background:#0C1730; border:1px solid rgba(232,237,247,0.2); padding:12px 14px; outline:none" style-focus="border-color:#4E92FF" />
            </sc-if>

            <sc-if value="{{ fld.isArea }}" hint-placeholder-val="{{ false }}">
              <textarea rows="4" value="{{ fld.value }}" onChange="{{ fld.onInput }}" placeholder="{{ fld.placeholder }}" style="width:100%; font-size:15px; line-height:1.7; color:#E8EDF7; background:#0C1730; border:1px solid rgba(232,237,247,0.2); padding:12px 14px; outline:none; resize:vertical" style-focus="border-color:#4E92FF"></textarea>
            </sc-if>

            <sc-if value="{{ fld.isNumber }}" hint-placeholder-val="{{ false }}">
              <input type="number" min="1" max="8" value="{{ fld.value }}" onChange="{{ fld.onInput }}" style="width:110px; font-size:15px; color:#E8EDF7; background:#0C1730; border:1px solid rgba(232,237,247,0.2); padding:12px 14px; outline:none" style-focus="border-color:#4E92FF" />
            </sc-if>

            <sc-if value="{{ fld.isImage }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start">
                <div style="width:210px; aspect-ratio:16/9; background:#0C1730; border:1px solid rgba(232,237,247,0.2); overflow:hidden; flex:0 0 auto">
                  <img src="{{ fld.value }}" alt="" style="width:100%; height:100%; object-fit:cover; display:block" />
                </div>
                <div style="flex:1 1 260px; min-width:0; display:flex; flex-direction:column; gap:10px">
                  <input type="text" value="{{ fld.value }}" onChange="{{ fld.onInput }}" placeholder="assets/ten-anh.png" style="width:100%; font-family:'JetBrains Mono',monospace; font-size:13px; color:#E8EDF7; background:#0C1730; border:1px solid rgba(232,237,247,0.2); padding:11px 13px; outline:none" style-focus="border-color:#4E92FF" />
                  <div style="display:flex; flex-wrap:wrap; gap:8px">
                    <sc-for list="{{ fld.assets }}" as="as" hint-placeholder-count="6">
                      <button type="button" onClick="{{ as.onPick }}" style="white-space:nowrap; font-family:'JetBrains Mono',monospace; font-size:11px; color:{{ as.fg }}; background:{{ as.bg }}; border:1px solid {{ as.border }}; padding:7px 10px; cursor:pointer" style-hover="border-color:#4E92FF; color:#4E92FF">{{ as.label }}</button>
                    </sc-for>
                  </div>
                  <span style="font-size:12px; line-height:1.6; color:#7C8AA3">{{ fld.fitNote }}</span>
                </div>
              </div>
            </sc-if>
          </div>
        </div>
      </sc-for>

      <div style="margin-top:26px; display:flex; flex-wrap:wrap; align-items:center; gap:16px">
        <button type="button" onClick="{{ onSave }}" style="font-size:14px; font-weight:600; color:#05070F; background:#4E92FF; border:0; padding:15px 28px; cursor:pointer" style-hover="background:#8FBAFF">Lưu thay đổi</button>
        <span style="font-size:13px; line-height:1.7; color:#7C8AA3; max-width:56ch">{{ footNote }}</span>
      </div>
    </main>

  </div>
</div>
</x-dc>

const STORE = 'pebblevina.cms.v1';
const clone = (o) => JSON.parse(JSON.stringify(o));

class Component extends DCLogic {
  constructor(p) {
    super(p);
    let data = clone(DEFAULTS);
    try {
      const raw = window.localStorage.getItem(STORE);
      if (raw) {
        const saved = JSON.parse(raw);
        for (const pg of Object.keys(data)) for (const s of Object.keys(data[pg]))
          if (saved[pg] && saved[pg][s]) Object.assign(data[pg][s], saved[pg][s]);
      }
    } catch (e) { /* first run or storage blocked */ }
    this.state = { page: 'home', section: 'hero', data, dirty: false, savedAt: 0 };
  }

  set(pg, sec, key, val) {
    this.setState(s => {
      const d = clone(s.data);
      d[pg][sec][key] = val;
      return { data: d, dirty: true };
    });
  }

  save() {
    try { window.localStorage.setItem(STORE, JSON.stringify(this.state.data)); } catch (e) {}
    this.setState({ dirty: false, savedAt: Date.now() });
  }

  reset() {
    this.setState({ data: clone(DEFAULTS), dirty: true });
  }

  renderVals() {
    const { page, section, data, dirty, savedAt } = this.state;
    const schema = SCHEMA[page];
    const list = schema.sections;
    const active = list.find(s => s.id === section) || list[0];
    const rec = data[page][active.id];

    const pages = Object.keys(SCHEMA).map(id => ({
      id, label: SCHEMA[id].label,
      bg: id === page ? '#4E92FF' : 'transparent',
      fg: id === page ? '#05070F' : '#A8B6CF',
      onPick: () => this.setState({ page: id, section: SCHEMA[id].sections[0].id })
    }));

    const sections = list.map((s, i) => {
      const on = data[page][s.id].visible !== false;
      const cur = s.id === active.id;
      return {
        id: s.id, label: s.label,
        num: String(i + 1).padStart(2, '0'),
        bg: cur ? 'rgba(78,146,255,0.14)' : 'transparent',
        fg: cur ? '#E8EDF7' : '#A8B6CF',
        mark: cur ? '#4E92FF' : 'transparent',
        dot: on ? '#4E92FF' : 'rgba(232,237,247,0.22)',
        onPick: () => this.setState({ section: s.id })
      };
    });

    const fields = active.fields.map(f => {
      const value = rec[f.key] === undefined ? '' : rec[f.key];
      return {
        key: f.key, label: f.label, hint: f.hint || '',
        placeholder: f.type === 'area' ? 'Nhập nội dung…' : 'Nhập nội dung',
        value,
        isText: f.type === 'text',
        isArea: f.type === 'area',
        isNumber: f.type === 'number',
        isImage: f.type === 'image',
        fitNote: f.fit || '',
        onInput: (e) => this.set(page, active.id, f.key, f.type === 'number' ? Number(e.target.value) : e.target.value),
        assets: f.type === 'image' ? ASSETS.map(a => ({
          path: a,
          label: a.replace('assets/', ''),
          bg: a === value ? 'rgba(78,146,255,0.16)' : 'transparent',
          fg: a === value ? '#4E92FF' : '#A8B6CF',
          border: a === value ? '#4E92FF' : 'rgba(232,237,247,0.2)',
          onPick: () => this.set(page, active.id, f.key, a)
        })) : []
      };
    });

    return {
      pages, sections, fields,
      activeLabel: active.label,
      activeKicker: schema.label.toUpperCase() + ' / SECTION',
      activeVisible: rec.visible !== false,
      onToggleVisible: (e) => this.set(page, active.id, 'visible', e.target.checked),
      onSave: () => this.save(),
      onReset: () => this.reset(),
      statusText: dirty ? 'CÓ THAY ĐỔI CHƯA LƯU' : (savedAt ? 'ĐÃ LƯU' : 'CHƯA CÓ THAY ĐỔI'),
      footNote: 'Bản này lưu vào bộ nhớ trình duyệt để bạn duyệt luồng nội dung. Khi nối API thật, thay hai hàm lưu/đọc là chạy được.'
    };
  }
}
</script>
